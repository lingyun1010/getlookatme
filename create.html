<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create a temporary LookAtMe profile from a resume." />
    <title>Create your profile — LookAtMe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/dashboard/dashboard.css" />
    <link rel="stylesheet" href="/src/onboarding/create.css" />
    <link rel="icon" href="/favicon.png" />
  </head>
  <body class="dashboard-page"><div id="dashboardRoot"></div><template id="createWorkspaceTemplate">
    <main class="dashboard-content create-workspace">
      <header class="create-workspace-heading"><div><h1>Profile</h1><p>Manage the information shown on your public profile.</p></div><a class="btn btn-secondary" href="/preview">Preview profile</a></header>

      <section class="create-panel" id="inputStep">
        <p class="step-label onboarding-step">Getting started</p>
        <h2 class="panel-title">Upload your CV</h2>
        <p class="lede">Upload a PDF or DOCX resume. Your private onboarding state is saved to your account and is not published.</p>
        <p class="linkedin-guidance">Using LinkedIn? Download your LinkedIn profile as a PDF, then upload it here.</p>
        <div class="source-actions"><button class="btn btn-secondary" id="manualProfileButton" type="button">Create manually</button></div>
        <div class="input-grid cv-only-grid">
          <div class="resume-stack">
            <label class="upload-card" for="resumeFile">
              <span>Upload PDF or DOCX</span>
              <small>Maximum 8 MB</small>
              <input id="resumeFile" type="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
            </label>
          </div>
        </div>
        <p class="error" id="inputError" role="alert" hidden></p>
        <button class="btn btn-primary primary" id="buildButton" type="button">Build temporary profile</button>
      </section>

      <section class="create-panel building" id="buildingStep" hidden aria-live="polite">
        <p class="step-label onboarding-step">Building</p>
        <div class="spinner" aria-hidden="true"></div>
        <h2 class="panel-title">Building your profile</h2>
        <p id="buildingStatus">Extracting resume text…</p>
      </section>

      <section class="create-panel" id="reviewStep" hidden>
        <h2 class="panel-title">Profile content</h2>
        <p class="lede">Edit each section independently. Changes are saved only when you choose Save.</p>
        <div class="issues issues-compact" id="reviewIssues" aria-live="polite"></div>
        <div id="structuredProfileEditor" class="structured-editor"></div>
        <div class="actions"><button class="btn btn-secondary secondary" id="startOverButton" type="button">Start over</button><a class="btn btn-primary" href="/preview">Preview profile</a></div>
      </section>
    </main></template>
  </body>
</html>
