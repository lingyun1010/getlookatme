<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="description" content="Manage your GetLookAtMe professional AI profile."/><title>Dashboard — GetLookAtMe</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=DM+Serif+Display&amp;display=swap" rel="stylesheet"/><link rel="stylesheet" href="/src/dashboard/dashboard.css"/><link rel="stylesheet" href="/src/onboarding/create.css"/></head>
<body class="dashboard-page"><div id="dashboardRoot"></div><template id="dashboardContentTemplate"><main class="dashboard-content">
    <header class="dashboard-heading"><div><div class="title-row"><h1>Dashboard</h1><span class="status-badge" id="profileStatus">Draft</span></div><p>Build, preview and publish your professional AI profile.</p></div></header>
    <section class="welcome"><p class="kicker">Creator overview</p><h2 id="welcomeTitle">Welcome back</h2><p>Everything you need to shape your profile, in one calm place.</p></section>
    <section class="overview-grid" aria-label="Profile overview">
      <article class="card completion-card"><div class="card-head"><div><p class="label">Profile completion</p><h2><span id="completionPercent">0</span>% complete</h2></div><div class="progress-ring" id="completionRing"><span id="ringPercent">0%</span></div></div><div class="progress"><i id="progressBar"></i></div><ul id="remainingItems"></ul><a class="primary-action" href="/dashboard/create">Complete profile →</a></article>
      <article class="card"><div class="card-icon avatar-icon">◉</div><p class="label">Living avatar</p><h2 id="avatarTitle">Checking avatar…</h2><p id="avatarCopy">Your avatar makes the profile feel personal and memorable.</p><a class="text-action" href="/dashboard/avatar" id="avatarAction">Manage avatar →</a></article>
      <article class="card"><div class="card-icon knowledge-icon">✦</div><p class="label">Knowledge base</p><h2 id="knowledgeTitle">Checking profile data…</h2><p id="knowledgeCopy">Your structured experience will ground future AI answers.</p><button class="disabled-action" disabled>Persistent knowledge base · Coming soon</button></article>
      <article class="card profile-card"><div><p class="label">Published profile</p><h2 id="pageTitle">Draft profile</h2><p id="pageCopy">Your profile is private while it is in draft.</p><code id="profileUrl" hidden></code></div><div class="card-actions" id="pageActions"></div></article>
    </section>
    <section class="lower-grid"><article class="card quick-actions"><p class="label">Quick actions</p><h2>Keep moving</h2><div><a href="/dashboard/create">◎ Edit profile <span>→</span></a><a href="/dashboard/avatar">◉ Manage avatar <span>→</span></a><a href="/preview">▤ Preview page <span>→</span></a><a id="liveProfileAction" hidden>↗ View published page <span>→</span></a></div></article><article class="card activity"><p class="label">Recent activity</p><div class="empty-icon">⌁</div><h2>No activity yet</h2><p>Profile views and recruiter interactions will appear here once tracking is enabled.</p></article></section>
  </main></template><script type="module" src="/src/dashboard/dashboardApp.ts"></script></body></html>
