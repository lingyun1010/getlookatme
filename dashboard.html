<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="description" content="Manage your GetLookAtMe professional AI profile."/><title>Dashboard — GetLookAtMe</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=DM+Serif+Display&amp;display=swap" rel="stylesheet"/><link rel="stylesheet" href="/src/dashboard/dashboard.css"/><link rel="stylesheet" href="/src/onboarding/create.css"/>    <link rel="icon" href="/favicon.jpg" />
<link rel="stylesheet" href="/src/feedback/feedback.css"/></head>
<body class="dashboard-page"><div id="dashboardRoot"></div><template id="dashboardContentTemplate"><main class="dashboard-content">
    <header class="page-intro">
      <div class="title-row"><h1 id="welcomeTitle">Welcome back</h1><span class="status-badge" id="overviewStatus">Draft</span></div>
      <p id="welcomeSubtitle">Your profile is almost ready.</p>
    </header>
    <article class="card status-card" aria-label="Profile status">
      <div class="card-head">
        <div>
          <p class="label">Profile status</p>
          <h2 class="status-title"><span id="completionPercent">0</span>% complete</h2>
        </div>
        <div class="progress-ring" id="completionRing"><span id="ringPercent">0%</span></div>
      </div>
      <div class="progress"><i id="progressBar"></i></div>
      <ul id="setupChecklist" class="setup-checklist"></ul>
      <div class="action-row">
        <a class="btn btn-primary" id="continueSetup" href="/dashboard/create">Continue setup</a>
        <a class="btn btn-secondary" id="previewProfile" href="/preview">Preview profile</a>
      </div>
    </article>
    <section class="activity-section" aria-labelledby="activityHeading">
      <h2 id="activityHeading" class="section-heading">Recent activity</h2>
      <div class="empty-state activity-empty">
        <p><strong>No activity yet.</strong></p>
        <p>Profile views and recruiter activity will appear here after publishing.</p>
      </div>
    </section>
  </main></template><script type="module" src="/src/dashboard/dashboardApp.ts"></script></body></html>
