<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="description" content="Manage your GetLookAtMe professional AI profile."/><title>Dashboard — GetLookAtMe</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=DM+Serif+Display&amp;display=swap" rel="stylesheet"/><link rel="stylesheet" href="/src/dashboard/dashboard.css"/><link rel="stylesheet" href="/src/onboarding/create.css"/><link rel="stylesheet" href="/src/feedback/feedback.css"/></head>
<body class="dashboard-page"><div id="dashboardRoot"></div><template id="dashboardContentTemplate"><main class="dashboard-content">
    <section class="welcome"><h2 id="welcomeTitle">Welcome back</h2><p>Let’s get your profile ready to share.</p></section>
    <section class="overview-grid" aria-label="Profile overview">
      <article class="card completion-card"><div class="card-head"><div><p class="label">Your profile setup</p><h2><span id="completionPercent">0</span>% complete</h2></div><div class="progress-ring" id="completionRing"><span id="ringPercent">0%</span></div></div><div class="progress"><i id="progressBar"></i></div><ul id="setupChecklist"></ul><a class="primary-action" id="continueSetup" href="/dashboard/create">Continue setup →</a></article>
      <article class="card quick-actions"><p class="label">Quick actions</p><h2>Keep moving</h2><div><a href="/dashboard/create">Upload / update CV <span>→</span></a><a href="/dashboard/avatar">Manage Avatar <span>→</span></a><a href="/preview">Preview profile <span>→</span></a><a id="liveProfileAction" hidden>View live profile <span>→</span></a></div></article>
      <article class="card profile-card"><div><p class="label">Profile status</p><h2 id="pageTitle">Draft</h2><p id="pageCopy">Your profile is private while it is in draft.</p></div><div class="card-actions" id="pageActions"></div></article>
    </section>
  </main></template><script type="module" src="/src/dashboard/dashboardApp.ts"></script></body></html>
