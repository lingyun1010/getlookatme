<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content=""
    />
    <title>Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color: #d7e2ea;
        background: #0c0c0c;
        font-family: "Kanit", ui-sans-serif, system-ui, sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      @property --highlight-progress {
        syntax: "<percentage>";
        inherits: false;
        initial-value: -24%;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        background: #0c0c0c;
        scroll-behavior: smooth;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        overflow-x: hidden;
        background: #0c0c0c;
      }

      .ghost-cursor {
        position: fixed;
        inset: 0;
        z-index: 8;
        pointer-events: none;
        mix-blend-mode: screen;
        opacity: 0.62;
      }

      .ghost-cursor > canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: transparent;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .hero {
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        overflow: hidden;
        isolation: isolate;
      }

      .hero::before {
        content: "";
        position: absolute;
        inset: -22% -8% auto;
        z-index: -1;
        height: 58vh;
        background:
          radial-gradient(circle at 20% 30%, rgba(255, 103, 202, 0.32), transparent 32%),
          radial-gradient(circle at 70% 12%, rgba(37, 151, 255, 0.32), transparent 34%),
          radial-gradient(circle at 52% 72%, rgba(255, 183, 55, 0.18), transparent 30%);
        filter: blur(48px);
        opacity: 0.95;
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: auto 0 0;
        z-index: -1;
        height: 42vh;
        background: linear-gradient(0deg, #0c0c0c 5%, rgba(12, 12, 12, 0));
      }

      .nav {
        position: relative;
        z-index: 5;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 28px clamp(24px, 4vw, 52px) 0;
        color: #d7e2ea;
        font-size: clamp(0.88rem, 1.55vw, 1.4rem);
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .nav a {
        transition: opacity 200ms ease;
      }

      .nav a:hover {
        opacity: 0.68;
      }

      .hero-title {
        position: relative;
        z-index: 3;
        width: 100%;
        margin-top: clamp(26px, 4vw, 44px);
        overflow: hidden;
        text-align: center;
      }

      .hero-kicker {
        margin-bottom: 10px;
        color: rgba(215, 226, 234, 0.72);
        font-size: clamp(0.76rem, 1.2vw, 1rem);
        font-weight: 400;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .hero-heading {
        width: 100%;
        color: transparent;
        background: linear-gradient(180deg, #646973 0%, #bbccd7 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        white-space: nowrap;
        font-size: clamp(3.7rem, 11.5vw, 11rem);
        font-weight: 900;
        letter-spacing: 0;
        line-height: 0.82;
        text-transform: uppercase;
      }

      .particle-heading {
        position: relative;
        height: clamp(105px, 13vw, 180px);
        overflow: hidden;
        background: none;
        -webkit-text-fill-color: initial;
      }

      .particle-heading canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      .particle-heading-text {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }

      .character-stage {
        position: absolute;
        left: 50%;
        bottom: 0;
        z-index: 2;
        width: clamp(305px, 40vw, 585px);
        aspect-ratio: 1;
        translate: -50% 0;
        pointer-events: none;
      }

      .character-glow {
        position: absolute;
        inset: 16% 8% 2%;
        border-radius: 999px 999px 24px 24px;
        background: linear-gradient(
          140deg,
          rgba(253, 78, 178, 0.56),
          rgba(16, 172, 255, 0.34),
          rgba(255, 199, 69, 0.34)
        );
        filter: blur(38px);
      }

      .character-frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center bottom;
        filter: drop-shadow(0 32px 44px rgba(0, 0, 0, 0.62));
      }

      .character-frame-host {
        position: absolute;
        inset: 0;
        z-index: 1;
        width: 100%;
        height: 100%;
      }

      .character-frame-host > div {
        width: 100%;
        height: 100%;
      }

      .character-placeholder {
        position: absolute;
        inset: 12% 12% 0;
        display: grid;
        place-items: center;
        border: 1px solid rgba(215, 226, 234, 0.3);
        border-radius: 48% 48% 18% 18%;
        color: #ffffff;
        background:
          radial-gradient(circle at 30% 24%, rgba(255, 103, 202, 0.34), transparent 35%),
          radial-gradient(circle at 74% 68%, rgba(37, 151, 255, 0.34), transparent 38%),
          rgba(24, 24, 28, 0.92);
        box-shadow: 0 32px 44px rgba(0, 0, 0, 0.42);
        font-size: clamp(4rem, 12vw, 9rem);
        font-weight: 800;
        letter-spacing: -0.05em;
      }

      .character-stage[data-state="thinking"] .character-glow {
        animation: avatar-thinking 1.25s ease-in-out infinite alternate;
      }

      @keyframes avatar-thinking {
        to {
          opacity: 0.68;
          filter: blur(48px);
        }
      }

      .avatar-chat {
        position: absolute;
        top: clamp(250px, 37vh, 390px);
        right: clamp(24px, 4vw, 52px);
        z-index: 6;
        width: min(390px, 30vw);
        min-width: 300px;
        color: #d7e2ea;
      }

      .avatar-speech {
        position: relative;
        min-height: 72px;
        max-height: 210px;
        padding: 18px 20px;
        overflow-y: auto;
        border: 1px solid rgba(215, 226, 234, 0.25);
        border-radius: 24px 24px 24px 8px;
        background: rgba(12, 12, 12, 0.9);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.38);
        backdrop-filter: blur(18px);
      }

      .avatar-speech::before,
      .avatar-speech::after {
        content: "";
        position: absolute;
        left: -15px;
        bottom: 22px;
        width: 0;
        height: 0;
        border-top: 11px solid transparent;
        border-right: 15px solid rgba(215, 226, 234, 0.25);
        border-bottom: 11px solid transparent;
      }

      .avatar-speech::after {
        left: -13px;
        bottom: 23px;
        border-top-width: 10px;
        border-right: 14px solid rgba(12, 12, 12, 0.94);
        border-bottom-width: 10px;
      }

      .avatar-speech p {
        color: #ffffff;
        font-size: 1rem;
        font-weight: 300;
        line-height: 1.5;
      }

      .avatar-speech[data-state="answered"] {
        animation: answer-reveal 240ms ease-out;
      }

      .avatar-speech[data-state="thinking"] p {
        min-width: 6ch;
        font-weight: 500;
        letter-spacing: 0.12em;
      }

      @keyframes answer-reveal {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .source-list {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 13px;
      }

      .source-chip,
      .question-chip {
        border: 1px solid rgba(215, 226, 234, 0.2);
        color: rgba(255, 255, 255, 0.8);
        background: rgba(255, 255, 255, 0.06);
        font: inherit;
        cursor: default;
      }

      button.source-chip {
        cursor: pointer;
      }

      .source-chip {
        padding: 6px 9px;
        border-radius: 999px;
        font-size: 0.76rem;
        line-height: 1.2;
      }

      .avatar-chat-form {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        padding: 6px;
        border: 1px solid rgba(215, 226, 234, 0.2);
        border-radius: 999px;
        background: rgba(12, 12, 12, 0.8);
        backdrop-filter: blur(16px);
      }

      .avatar-chat-form input {
        width: 100%;
        min-width: 0;
        padding: 8px 8px 8px 12px;
        border: 0;
        outline: 0;
        color: #ffffff;
        background: transparent;
        font: inherit;
        font-size: 0.92rem;
      }

      .avatar-chat-form input::placeholder {
        color: rgba(215, 226, 234, 0.55);
      }

      .avatar-chat-form button {
        flex: 0 0 auto;
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 50%;
        color: #ffffff;
        background: linear-gradient(123deg, #b600a8, #7621b0 65%, #be4c00);
        font: inherit;
        font-size: 1.2rem;
        cursor: pointer;
      }

      .avatar-chat-form button:disabled,
      .avatar-chat-form input:disabled {
        cursor: wait;
        opacity: 0.6;
      }

      .suggested-questions {
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        transition: opacity 180ms ease;
      }

      .question-chip {
        --float-x: 0px;
        --float-y: 6px;
        --float-time: 5.6s;
        --float-delay: 0s;
        position: absolute;
        width: 160px;
        min-height: 68px;
        padding: 60px 12px;
        overflow: visible;
        border-color: rgba(180, 151, 207, 0.22);
        border-radius: 100%;
        color: rgba(255, 255, 255, 0.82);
        background: rgba(22, 16, 27, 0.64);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.24), 0 0 18px rgba(180, 126, 207, 0.08);
        backdrop-filter: blur(12px);
        font-size: 0.82rem;
        line-height: 1.3;
        cursor: pointer;
        pointer-events: auto;
        animation: question-float var(--float-time) ease-in-out var(--float-delay) infinite alternate;
        transition: border-color 180ms ease, box-shadow 180ms ease, opacity 180ms ease;
      }

      .question-chip:nth-child(1) { top: 35%; left: 4%; width: 190px; --float-time: 5.2s; }
      .question-chip:nth-child(2) { top: 49%; left: 16%; width: 220px; --float-x: 3px; --float-y: 5px; --float-time: 6.1s; --float-delay: -1.4s; }
      .question-chip:nth-child(3) { top: 63%; left: 9%; width: 166px; --float-x: -2px; --float-y: 7px; --float-time: 5.7s; --float-delay: -2.2s; }
      .question-chip:nth-child(4) { top: 53%; right: 8%; width: 205px; --float-x: -3px; --float-y: 5px; --float-time: 6.4s; --float-delay: -0.8s; }
      .question-chip:nth-child(5) { top: 72%; right: 12%; width: 184px; --float-x: 2px; --float-y: 7px; --float-time: 5.4s; --float-delay: -1.8s; }

      .question-chip::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        border: 1px solid rgba(180, 151, 207, 0.48);
        border-radius: inherit;
        box-shadow: inset 0 0 8px rgba(180, 151, 207, 0.1), 0 0 12px rgba(180, 151, 207, 0.12);
        pointer-events: none;
      }

      .question-chip-label {
        position: relative;
        z-index: 2;
        display: block;
        white-space: normal;
        text-align: center;
        text-wrap: balance;
      }

      .question-electric-border {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 1;
        display: block;
        translate: -50% -50%;
        pointer-events: none;
      }

      .suggested-questions[data-state="thinking"] {
        opacity: 0.5;
      }

      @keyframes question-float {
        from { transform: translate3d(0, 0, 0); }
        to { transform: translate3d(var(--float-x), calc(var(--float-y) * -1), 0); }
      }

      .question-particle,
      .question-particle-point {
        position: absolute;
        top: calc(50% - 5px);
        left: calc(50% - 5px);
        display: block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        pointer-events: none;
      }

      .question-particle {
        z-index: 1;
        animation: question-particle var(--particle-time) ease 1;
      }

      .question-particle-point {
        top: 0;
        left: 0;
        background: var(--particle-color);
        animation: question-particle-point var(--particle-time) ease 1;
      }

      @keyframes question-particle {
        0% { transform: rotate(0deg) translate(var(--start-x), var(--start-y)); }
        70% { transform: rotate(calc(var(--rotate) * 0.5)) translate(calc(var(--end-x) * 1.2), calc(var(--end-y) * 1.2)); }
        100% { transform: rotate(var(--rotate)) translate(calc(var(--end-x) * 0.5), calc(var(--end-y) * 0.5)); }
      }

      @keyframes question-particle-point {
        0% { transform: scale(0); opacity: 0; }
        38% { opacity: 0.9; }
        65% { transform: scale(var(--particle-scale)); opacity: 0.9; }
        100% { transform: scale(0); opacity: 0; }
      }

      .question-chip:hover,
      .question-chip:focus-visible,
      button.source-chip:hover,
      button.source-chip:focus-visible {
        border-color: rgba(255, 255, 255, 0.58);
        color: #ffffff;
      }

      .question-chip:hover {
        scale: 1.045;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28), 0 0 22px rgba(201, 142, 218, 0.16);
        animation-play-state: paused;
      }

      .question-chip:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.88);
        outline-offset: 3px;
      }

      .profile-highlight {
        animation: profile-highlight 1.8s ease-out;
      }

      @keyframes profile-highlight {
        0%, 35% { box-shadow: 0 0 0 3px rgba(255, 79, 190, 0.9), 0 0 42px rgba(0, 178, 255, 0.52); }
        100% { box-shadow: none; }
      }

      .hero-bottom {
        position: relative;
        z-index: 4;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-top: auto;
        padding: 0 clamp(24px, 4vw, 52px) clamp(28px, 4vw, 44px);
      }

      .hero-bottom p {
        max-width: 330px;
        color: #d7e2ea;
        font-size: clamp(0.8rem, 1.35vw, 1.4rem);
        font-weight: 300;
        letter-spacing: 0.04em;
        line-height: 1.22;
        text-transform: uppercase;
      }

      .contact-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 14px clamp(26px, 4vw, 48px);
        border-radius: 999px;
        outline: 2px solid #ffffff;
        outline-offset: -3px;
        color: #ffffff;
        background: linear-gradient(123deg, #18011f 7%, #b600a8 37%, #7621b0 72%, #be4c00 100%);
        box-shadow: 0 4px 4px rgba(181, 1, 167, 0.25), 4px 4px 12px #7721b1 inset;
        font-size: clamp(0.78rem, 1.2vw, 1rem);
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .content-band {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        padding: 26px clamp(20px, 4vw, 52px) 54px;
        background: #0c0c0c;
      }

      .content-band article {
        min-height: 170px;
        padding: 22px;
        border: 1px solid rgba(215, 226, 234, 0.16);
        border-radius: 24px;
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.025)),
          radial-gradient(circle at 18% 18%, rgba(255, 89, 195, 0.2), transparent 34%);
      }

      .motion-ready .reveal-on-scroll {
        opacity: 0;
        transform: translate3d(0, 72px, 0) scale(0.96);
        transition:
          opacity 0.75s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
        transition-delay: var(--reveal-delay, 0ms);
        will-change: opacity, transform;
      }

      .motion-ready .reveal-on-scroll.is-visible {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }

      .content-band h2 {
        margin-bottom: 10px;
        color: #ffffff;
        font-size: 1.18rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .content-band p {
        color: rgba(215, 226, 234, 0.72);
        font-size: 1rem;
        font-weight: 300;
        line-height: 1.52;
      }

      .marquee {
        display: flex;
        gap: 12px;
        width: max-content;
        padding: 24px 0;
        animation: slide 36s linear infinite;
      }

      .marquee-wrap {
        overflow: hidden;
        border-top: 1px solid rgba(215, 226, 234, 0.12);
        border-bottom: 1px solid rgba(215, 226, 234, 0.12);
        background: #0c0c0c;
      }

      .marquee span {
        display: grid;
        place-items: center;
        min-width: clamp(210px, 24vw, 360px);
        min-height: 116px;
        border: 1px solid rgba(215, 226, 234, 0.16);
        border-radius: 24px;
        color: #ffffff;
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02)),
          radial-gradient(circle at 20% 20%, rgba(255, 89, 195, 0.2), transparent 34%),
          radial-gradient(circle at 80% 76%, rgba(37, 151, 255, 0.18), transparent 36%);
        font-size: clamp(1rem, 2.4vw, 1.9rem);
        font-weight: 800;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      @keyframes slide {
        from {
          transform: translateX(0);
        }

        to {
          transform: translateX(-50%);
        }
      }

      .section-dark,
      .section-light {
        padding: clamp(78px, 10vw, 140px) clamp(20px, 4vw, 52px);
      }

      .section-dark {
        color: #d7e2ea;
        background: #0c0c0c;
      }

      .section-light {
        color: #0c0c0c;
        background: #ffffff;
      }

      .section-head {
        width: min(900px, 100%);
        margin: 0 auto clamp(40px, 6vw, 72px);
        text-align: center;
      }

      .section-head h2 {
        color: inherit;
        font-size: clamp(3.1rem, 11vw, 9.6rem);
        font-weight: 900;
        letter-spacing: 0;
        line-height: 0.86;
        text-transform: uppercase;
      }

      .section-head p {
        max-width: 760px;
        margin: 28px auto 0;
        color: rgba(215, 226, 234, 0.76);
        font-size: clamp(1rem, 1.8vw, 1.35rem);
        font-weight: 300;
        line-height: 1.65;
      }

      .motion-ready .about-copy h2 {
        --highlight-progress: -24%;
        color: transparent;
        background: linear-gradient(
          to bottom,
          rgba(238, 247, 252, 0.98) 0%,
          rgba(238, 247, 252, 0.98) var(--highlight-progress),
          rgba(215, 226, 234, 0.68) calc(var(--highlight-progress) + 10%),
          rgba(215, 226, 234, 0.22) calc(var(--highlight-progress) + 24%),
          rgba(215, 226, 234, 0.22) 100%
        );
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        transition: --highlight-progress 1.5s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .motion-ready .about-letter {
        color: rgba(215, 226, 234, 0.22);
        transition: color 0.24s ease-out;
        transition-delay: 0ms;
      }

      .motion-ready .about-copy.is-visible h2 {
        --highlight-progress: 100%;
      }

      .motion-ready .about-copy.is-visible .about-letter {
        color: rgba(238, 247, 252, 0.96);
        transition-delay: var(--letter-delay);
      }

      .section-light .section-head p {
        color: rgba(12, 12, 12, 0.62);
      }

      .skills-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        width: min(1120px, 100%);
        margin: 0 auto;
      }

      .skill-card,
      .project-card {
        --edge-proximity: 0;
        --cursor-angle: 45deg;
        --edge-sensitivity: 30;
        --color-sensitivity: 48;
        --card-bg: #16181b;
        --glow-padding: 40px;
        --cone-spread: 25;
        --fill-opacity: 0.42;
        --glow-color: hsl(292deg 92% 74% / 100%);
        --glow-color-60: hsl(292deg 92% 74% / 60%);
        --glow-color-50: hsl(292deg 92% 74% / 50%);
        --glow-color-40: hsl(292deg 92% 74% / 40%);
        --glow-color-30: hsl(292deg 92% 74% / 30%);
        --glow-color-20: hsl(292deg 92% 74% / 20%);
        --glow-color-10: hsl(292deg 92% 74% / 10%);
        --gradient-one: radial-gradient(at 80% 55%, #c084fc 0px, transparent 50%);
        --gradient-two: radial-gradient(at 69% 34%, #f472b6 0px, transparent 50%);
        --gradient-three: radial-gradient(at 8% 6%, #38bdf8 0px, transparent 50%);
        --gradient-four: radial-gradient(at 41% 38%, #c084fc 0px, transparent 50%);
        --gradient-five: radial-gradient(at 86% 85%, #f472b6 0px, transparent 50%);
        --gradient-six: radial-gradient(at 82% 18%, #38bdf8 0px, transparent 50%);
        --gradient-seven: radial-gradient(at 51% 4%, #f472b6 0px, transparent 50%);
        --gradient-base: linear-gradient(#c084fc 0 100%);
        position: relative;
        isolation: isolate;
        overflow: visible;
        border: 1px solid rgba(215, 226, 234, 0.16);
        border-radius: 28px;
        background: var(--card-bg);
        box-shadow:
          rgba(0, 0, 0, 0.12) 0 2px 4px,
          rgba(0, 0, 0, 0.14) 0 12px 30px;
        transform: translate3d(0, 0, 0.01px);
      }

      .skill-card > *,
      .project-card > * {
        position: relative;
        z-index: 2;
      }

      .skill-card::before,
      .skill-card::after,
      .project-card::before,
      .project-card::after,
      .skill-card .edge-light,
      .project-card .edge-light {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        transition: opacity 0.25s ease-out;
      }

      .skill-card:not(:hover)::before,
      .skill-card:not(:hover)::after,
      .skill-card:not(:hover) .edge-light,
      .project-card:not(:hover)::before,
      .project-card:not(:hover)::after,
      .project-card:not(:hover) .edge-light {
        opacity: 0;
        transition: opacity 0.75s ease-in-out;
      }

      .skill-card::before,
      .project-card::before {
        z-index: 0;
        border: 1px solid transparent;
        background:
          linear-gradient(var(--card-bg) 0 100%) padding-box,
          linear-gradient(rgb(255 255 255 / 0%) 0% 100%) border-box,
          var(--gradient-one) border-box,
          var(--gradient-two) border-box,
          var(--gradient-three) border-box,
          var(--gradient-four) border-box,
          var(--gradient-five) border-box,
          var(--gradient-six) border-box,
          var(--gradient-seven) border-box,
          var(--gradient-base) border-box;
        opacity: calc((var(--edge-proximity) - var(--color-sensitivity)) / (100 - var(--color-sensitivity)));
        mask-image:
          conic-gradient(
            from var(--cursor-angle) at center,
            black calc(var(--cone-spread) * 1%),
            transparent calc((var(--cone-spread) + 15) * 1%),
            transparent calc((100 - var(--cone-spread) - 15) * 1%),
            black calc((100 - var(--cone-spread)) * 1%)
          );
      }

      .skill-card::after,
      .project-card::after {
        z-index: 0;
        border: 1px solid transparent;
        background:
          var(--gradient-one) padding-box,
          var(--gradient-two) padding-box,
          var(--gradient-three) padding-box,
          var(--gradient-four) padding-box,
          var(--gradient-five) padding-box,
          var(--gradient-six) padding-box,
          var(--gradient-seven) padding-box,
          var(--gradient-base) padding-box;
        opacity: calc(var(--fill-opacity) * (var(--edge-proximity) - var(--color-sensitivity)) / (100 - var(--color-sensitivity)));
        mix-blend-mode: soft-light;
        mask-image:
          linear-gradient(to bottom, black, black),
          radial-gradient(ellipse at 50% 50%, black 40%, transparent 65%),
          radial-gradient(ellipse at 66% 66%, black 5%, transparent 40%),
          radial-gradient(ellipse at 33% 33%, black 5%, transparent 40%),
          radial-gradient(ellipse at 66% 33%, black 5%, transparent 40%),
          radial-gradient(ellipse at 33% 66%, black 5%, transparent 40%),
          conic-gradient(from var(--cursor-angle) at center, transparent 5%, black 15%, black 85%, transparent 95%);
        mask-composite: subtract, add, add, add, add, add;
      }

      .skill-card .edge-light,
      .project-card .edge-light {
        inset: calc(var(--glow-padding) * -1);
        z-index: 1;
        opacity: calc((var(--edge-proximity) - var(--edge-sensitivity)) / (100 - var(--edge-sensitivity)));
        mix-blend-mode: plus-lighter;
        mask-image:
          conic-gradient(
            from var(--cursor-angle) at center,
            black 2.5%,
            transparent 10%,
            transparent 90%,
            black 97.5%
          );
      }

      .skill-card .edge-light::before,
      .project-card .edge-light::before {
        content: "";
        position: absolute;
        inset: var(--glow-padding);
        border-radius: inherit;
        box-shadow:
          inset 0 0 0 1px var(--glow-color),
          inset 0 0 1px 0 var(--glow-color-60),
          inset 0 0 3px 0 var(--glow-color-50),
          inset 0 0 6px 0 var(--glow-color-40),
          inset 0 0 15px 0 var(--glow-color-30),
          inset 0 0 25px 2px var(--glow-color-20),
          inset 0 0 50px 2px var(--glow-color-10),
          0 0 1px 0 var(--glow-color-60),
          0 0 3px 0 var(--glow-color-50),
          0 0 6px 0 var(--glow-color-40),
          0 0 15px 0 var(--glow-color-30),
          0 0 25px 2px var(--glow-color-20),
          0 0 50px 2px var(--glow-color-10);
      }

      .skill-card {
        min-height: 280px;
        padding: 24px;
      }

      .skill-card strong {
        display: block;
        margin-bottom: 18px;
        color: #ffffff;
        font-size: 1.08rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .skill-card span {
        display: inline-flex;
        margin: 0 6px 8px 0;
        padding: 7px 10px;
        border-radius: 999px;
        color: #ffffff;
        background: rgba(215, 226, 234, 0.1);
        font-size: 0.92rem;
        font-weight: 400;
      }

      .services {
        border-radius: clamp(38px, 5vw, 64px) clamp(38px, 5vw, 64px) 0 0;
      }

      .service-list {
        width: min(1040px, 100%);
        margin: 0 auto;
        border-top: 1px solid rgba(12, 12, 12, 0.15);
      }

      .service-item {
        display: grid;
        grid-template-columns: minmax(100px, 0.36fr) minmax(0, 1fr);
        gap: clamp(18px, 4vw, 52px);
        padding: clamp(32px, 5vw, 54px) 0;
        border-bottom: 1px solid rgba(12, 12, 12, 0.15);
      }

      .service-item > span {
        font-size: clamp(3.4rem, 10vw, 8.75rem);
        font-weight: 900;
        line-height: 0.82;
      }

      .service-item h3,
      .experience-card h3,
      .project-card h3 {
        margin-bottom: 12px;
        font-size: clamp(1.15rem, 2.5vw, 2.1rem);
        font-weight: 700;
        letter-spacing: 0.03em;
        line-height: 1.05;
        text-transform: uppercase;
      }

      .service-item p {
        max-width: 760px;
        color: rgba(12, 12, 12, 0.62);
        font-size: clamp(1rem, 1.5vw, 1.25rem);
        font-weight: 300;
        line-height: 1.62;
      }

      .projects {
        margin-top: -42px;
        border-radius: clamp(38px, 5vw, 64px) clamp(38px, 5vw, 64px) 0 0;
      }

      .project-grid {
        display: block;
        width: min(1200px, 100%);
        margin: 0 auto;
        padding-bottom: clamp(80px, 16vh, 180px);
      }

      .project-card {
        position: sticky;
        top: calc(clamp(74px, 12vh, 130px) + var(--stack-index, 0) * 18px);
        z-index: calc(10 + var(--stack-index, 0));

        margin-bottom: clamp(72px, 14vh, 150px);

      .project-number {

      .project-media {

        margin: -4px 0 22px;

        border-radius: 18px;

      }

      .project-media img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.35s ease;
      }

      .project-media:hover img,
      .project-media:focus-visible img {
        transform: scale(1.025);

      .project-type {
        margin-bottom: 14px;
        color: #ff78cf;
        font-size: 0.88rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .project-card p {
        color: rgba(215, 226, 234, 0.72);
        font-size: 1rem;
        font-weight: 300;
        line-height: 1.58;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 24px;
      }

      .tags span {
        padding: 7px 10px;
        border-radius: 999px;

        background: rgba(215, 226, 234, 0.1);

      }

      .project-links {
        display: flex;

      .project-links a {
        color: #ffffff;
        font-size: 0.88rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-decoration: underline;
        text-decoration-color: rgba(255, 120, 207, 0.6);
        text-underline-offset: 5px;
      }

      .experience-layout,
      .contact-layout {
        display: grid;
        grid-template-columns: 0.9fr 1.1fr;
        gap: clamp(30px, 6vw, 74px);
        width: min(1120px, 100%);
        margin: 0 auto;
      }

      .eyebrow,
      .period {
        display: block;
        margin-bottom: 14px;
        color: #b600a8;
        font-size: 0.86rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .experience-layout h2,
      .contact-layout h2 {
        font-size: clamp(2.2rem, 1vw, 5rem);
        font-weight: 900;
        letter-spacing: 0;
        line-height: 0.92;
        text-transform: uppercase;
      }

      .experience-card {
        padding-top: 6px;
      }

      .experience-card p,
      .contact-layout p {
        color: rgba(12, 12, 12, 0.64);
        font-size: 1.05rem;
        font-weight: 300;
        line-height: 1.62;
      }

      .experience-card ul {
        margin-top: 22px;
        padding-left: 22px;
        color: rgba(12, 12, 12, 0.72);
        font-size: 1.03rem;

        line-height: 1.64;
      }

      .experience-card li + li {
        margin-top: 10px;
      }

        color: #d7e2ea;
      }

      .contact-layout p {
        margin-top: 18px;
        color: rgba(215, 226, 234, 0.72);
      }

      .contact-panel {
        padding: clamp(24px, 4vw, 42px);
        border: 1px solid rgba(215, 226, 234, 0.18);
        border-radius: 30px;
        background:
          radial-gradient(circle at 18% 20%, rgba(255, 91, 192, 0.2), transparent 34%),
          radial-gradient(circle at 82% 84%, rgba(0, 169, 255, 0.18), transparent 34%),
          rgba(255, 255, 255, 0.05);
      }

      .contact-panel a,
      .contact-panel span {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 50px;
        margin-top: 18px;
        color: #ffffff;
        font-size: 1.05rem;
      }

      @media (max-width: 900px) {
        .nav {
          justify-content: center;
          flex-wrap: wrap;
          gap: 8px clamp(18px, 5vw, 34px);
          padding: 20px 20px 0;
          font-size: clamp(0.72rem, 1.8vw, 0.86rem);
        }

        .hero {
          min-height: 100svh;
          padding-bottom: 34px;
        }

        .hero-title {
          margin-top: clamp(22px, 5vw, 36px);
          padding-inline: 16px;
          overflow: visible;
        }

        .hero-heading {
          white-space: normal;
          font-size: clamp(3.4rem, 15vw, 7.4rem);
          line-height: 0.86;
        }

        .particle-heading {
          height: clamp(118px, 31vw, 160px);
        }

        .character-stage {
          position: relative;
          left: auto;
          bottom: auto;
          flex: 0 0 auto;
          width: clamp(300px, 68vw, 480px);
          margin: clamp(16px, 4vw, 30px) auto 0;
          translate: none;
        }

        .hero-bottom {
          align-items: flex-start;
          flex-direction: column;
          gap: 18px;
          width: min(620px, 100%);
          margin: 28px auto 0;
          padding: 0 20px;
        }

        .avatar-chat {
          position: relative;
          top: auto;
          right: auto;
          left: auto;
          width: min(560px, calc(100% - 32px));
          min-width: 0;
          margin: -12px auto 0;
          translate: none;
        }

        .avatar-speech {
          max-height: 160px;
          overflow: visible auto;
          border-radius: 22px;
        }

        .avatar-speech::before,
        .avatar-speech::after {
          left: 50%;
          bottom: auto;
          translate: -50% 0;
          border-right: 12px solid transparent;
          border-bottom: 14px solid rgba(215, 226, 234, 0.25);
          border-left: 12px solid transparent;
          border-top: 0;
        }

        .avatar-speech::before {
          top: -15px;
        }

        .avatar-speech::after {
          top: -13px;
          border-right-width: 11px;
          border-bottom: 13px solid rgba(12, 12, 12, 0.94);
          border-left-width: 11px;
        }

        .suggested-questions {
          position: relative;
          inset: auto;
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 9px;
          width: min(620px, calc(100% - 32px));
          margin: 18px auto 0;
        }

        .question-chip,
        .question-chip:nth-child(n) {
          position: relative;
          inset: auto;
          width: clamp(148px, 30vw, 190px);
          min-height: 64px;
        }

        .content-band,
        .skills-grid,
        .experience-layout,
        .contact-layout,
        .service-item {
          grid-template-columns: 1fr;
        }

        .project-card {
          top: calc(76px + var(--stack-index, 0) * 10px);
          min-height: 420px;
          margin-bottom: 72px;
        }
      }

      @media (max-width: 540px) {
        .nav {
          padding-top: 22px;
          font-size: 0.8rem;
        }

        .hero-kicker {
          width: min(320px, calc(100% - 32px));
          margin-right: auto;
          margin-left: auto;
        }

        .hero-bottom p {
          max-width: 100%;
        }

        .contact-button {
          width: 100%;
        }

        .hero {
          min-height: 0;
        }

        .project-grid {
          padding-bottom: 72px;
        }

        .project-card {
          top: calc(64px + var(--stack-index, 0) * 7px);
          min-height: 380px;
          margin-bottom: 54px;
          border-radius: 24px;
        }

        .project-media {
          height: 180px;
        }

        .character-stage {
          width: min(88vw, 390px);
          margin-top: 18px;
        }

        .avatar-chat {
          width: calc(100% - 28px);
          margin-top: -8px;
        }

        .suggested-questions {
          justify-content: flex-start;
          width: calc(100% - 28px);
          margin-top: 16px;
        }

        .question-chip {
          width: min(46vw, 174px);
          max-width: 100%;
          min-height: 62px;
          padding: 11px 15px;
          font-size: 0.78rem;
        }

        .question-chip:nth-child(n + 4) {
          animation: none;
          opacity: 0.76;
        }

        .avatar-speech {
          min-height: 64px;
          padding: 15px 16px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .motion-ready .reveal-on-scroll {
          opacity: 1;
          transform: none;
          transition: none;
        }

        .motion-ready .about-copy h2 {
          --highlight-progress: 100%;
          transition: none;
        }

        .motion-ready .about-letter {
          color: rgba(238, 247, 252, 0.96);
          transition: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .character-stage[data-state="thinking"] .character-glow,
        .avatar-speech[data-state="answered"],
        .profile-highlight {
          animation: none;
        }

        .question-chip {
          animation: none;
          transition: border-color 180ms ease, opacity 180ms ease;
        }

        .question-chip:hover {
          scale: 1;
        }

        .question-particle {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="ghost-cursor" id="ghostCursor" aria-hidden="true"></div>
    <main>
      <section class="hero" id="home">
        <nav class="nav" aria-label="Primary navigation">
          <a href="#home">Home</a>
          <a href="#about">About</a>
          <a href="#services">Services</a>
          <a href="#projects">Projects</a>
          <a href="#contact">Contact</a>
        </nav>

        <div class="hero-title">
          <p class="hero-kicker" id="profileHeadline"></p>
          <h1 class="hero-heading particle-heading" id="profileGreeting">
            <canvas id="profileGreetingCanvas" aria-hidden="true"></canvas>
            <span class="particle-heading-text" id="profileGreetingText"></span>
          </h1>
        </div>

        <div class="character-stage" aria-label="Animated character portrait controlled by pointer direction">
          <div class="character-glow" aria-hidden="true"></div>
          <div class="character-frame-host" id="characterFrameHost" hidden aria-hidden="true"></div>
          <img
            id="characterFrame"
            class="character-frame"
            alt=""
          />
          <div class="character-placeholder" id="characterPlaceholder" hidden aria-hidden="true"></div>
        </div>

        <div class="avatar-chat" aria-label="Ask this portfolio avatar">
          <div class="avatar-speech" id="avatarSpeech" data-state="idle" role="status" aria-live="polite">
            <p id="avatarAnswer">Ask me about my work.</p>
            <div class="source-list" id="avatarSources" aria-label="Answer sources"></div>
          </div>
          <form class="avatar-chat-form" id="avatarChatForm">
            <input id="avatarQuestion" name="message" type="text" maxlength="500" autocomplete="off" placeholder="Ask me anything..." aria-label="Ask a portfolio question" />
            <button type="submit" id="avatarSubmit" aria-label="Send question">→</button>
          </form>
        </div>

        <div class="suggested-questions" id="suggestedQuestions" aria-label="Suggested questions"></div>

        <div class="hero-bottom">
          <p id="profileIntroduction"></p>
          <a class="contact-button" id="profileContactButton">Contact me</a>
        </div>
      </section>

      <section class="content-band" id="work" aria-label="Portfolio highlights"></section>

      <section class="section-dark" id="about">
        <div class="section-head about-copy">
          <h2 class="hero-heading">About me</h2>
          <p id="profileSummary"></p>
        </div>

        <div class="skills-grid" id="profileSkills"></div>
      </section>

      <section class="section-light services" id="services">
        <div class="section-head">
          <h2>Services</h2>
          <p id="profileServicesIntro"></p>
        </div>

        <div class="service-list" id="profileServices"></div>
      </section>

      <section class="section-dark projects" id="projects">
        <div class="section-head">
          <h2 class="hero-heading">Projects</h2>
        </div>

        <div class="project-grid" id="profileProjects"></div>
      </section>

      <section class="section-light" id="experience">
        <div class="experience-layout">
          <div>
            <span class="eyebrow">Professional experience</span>
            <h2 id="profileExperienceSummary"></h2>
          </div>
          <article class="experience-card" id="profileExperience"></article>
        </div>
      </section>

      <section class="section-dark" id="contact">
        <div class="contact-layout">
          <div>
            <span class="eyebrow">Education</span>
            <div id="profileEducation"></div>
          </div>
          <div class="contact-panel">
            <span class="eyebrow">Contact</span>
            <h2 id="profileContactHeading"></h2>
            <a id="profileEmail"></a>
            <span id="profileLocation"></span>
            <a id="profileGitHub" target="_blank" rel="noreferrer">GitHub</a>
            <a id="profileLinkedIn" target="_blank" rel="noreferrer">LinkedIn</a>
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import { LookAtMeAvatar } from "lookatme-avatar/react";
      import { resolveProfile } from "/src/profile/resolveProfile.ts";
      import { featuredEducation, featuredExperience } from "/src/profile/presentation.ts";
      import { loadTemporaryProfile } from "/src/onboarding/session.ts";
      import * as THREE from "three";
      import { EffectComposer } from "three/examples/jsm/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/examples/jsm/postprocessing/RenderPass.js";
      import { ShaderPass } from "three/examples/jsm/postprocessing/ShaderPass.js";
      import { UnrealBloomPass } from "three/examples/jsm/postprocessing/UnrealBloomPass.js";

      if (window.location.pathname === "/create") {
        window.location.replace("/create.html");
        throw new Error("Opening profile creation flow");
      }
      const profile = window.location.pathname === "/preview"
        ? loadTemporaryProfile()
        : resolveProfile(window.location.pathname);
      if (!profile) {
        const notFound = document.createElement("main");
        notFound.className = "profile-not-found";
        const heading = document.createElement("h1");
        heading.textContent = "Profile not found";
        const detail = document.createElement("p");
        detail.textContent = "This LookAtMe profile is not published.";
        notFound.append(heading, detail);
        document.body.replaceChildren(notFound);
        throw new Error(`Unknown profile path: ${window.location.pathname}`);
      }

      const setText = (id, value) => {
        const element = document.querySelector(`#${id}`);
        if (element) element.textContent = value ?? "";
      };

      const safeExternalUrl = (value) => {
        if (!value) return null;
        try {
          const url = new URL(value, window.location.origin);
          return url.protocol === "http:" || url.protocol === "https:" ? url.href : null;
        } catch {
          return null;
        }
      };

      const identity = profile.identity;
      const emailHref = identity.email ? `mailto:${identity.email}` : "#contact";
      document.title = profile.seo.title;
      document.querySelector('meta[name="description"]')?.setAttribute("content", profile.seo.description);
      setText("profileHeadline", identity.headline);
      const greeting = `Hi, I am ${identity.preferredName}`;
      setText("profileGreetingText", greeting);
      setText("profileIntroduction", identity.introduction);
      setText("profileSummary", identity.summary);
      setText("profileLocation", identity.location);
      setText("profileEmail", identity.email);
      setText("profileServicesIntro", profile.presentation.servicesIntro);
      setText("profileContactHeading", profile.presentation.contactHeading);
      document.querySelector("#profileEmail")?.setAttribute("href", emailHref);
      document.querySelector("#profileContactButton")?.setAttribute("href", emailHref);
      const setOptionalLink = (selector, url) => {
        const link = document.querySelector(selector);
        if (!link) return;
        const href = safeExternalUrl(url);
        if (href) link.setAttribute("href", href);
        else link.hidden = true;
      };
      setOptionalLink("#profileGitHub", identity.githubUrl);
      setOptionalLink("#profileLinkedIn", identity.linkedinUrl);
      document.querySelector(".avatar-chat")?.setAttribute("aria-label", `Ask ${identity.preferredName}'s portfolio avatar`);
      document.querySelector("#avatarQuestion")?.setAttribute("aria-label", `Ask ${identity.preferredName} a question`);

      const frameImage = document.querySelector("#characterFrame");
      const characterPlaceholder = document.querySelector("#characterPlaceholder");
      const frameHost = document.querySelector("#characterFrameHost");
      const avatarRoot = frameHost ? createRoot(frameHost) : null;
      frameImage.setAttribute("alt", profile.avatar.alt);
      const renderOriginalAvatar = () => {
        const imageUrl = profile.avatarImageUrl;
        frameHost?.setAttribute("hidden", "true");

      function initParticleHeading(container, canvas, text) {
        const context = canvas.getContext("2d");
        if (!context) return;

        const reducedMotionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
        let reducedMotion = reducedMotionQuery.matches;
        let particles = [];
        let frame;
        let resizeFrame;
        let buildId = 0;
        let width = 0;
        let height = 0;
        let gatherStart = 0;
        let gathering = false;
        const pointer = { active: false, x: 0, y: 0, smoothX: 0, smoothY: 0 };
        const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
        const easeOutCubic = (value) => 1 - Math.pow(1 - value, 3);

        function gather(scatter = true) {
          const now = performance.now();
          particles.forEach((particle) => {
            if (scatter && !reducedMotion) {
              const angle = particle.seed * Math.PI * 2;
              const distance = 140 * (0.4 + particle.depth * 0.7);
              particle.x = particle.targetX + Math.cos(angle) * distance;
              particle.y = particle.targetY + Math.sin(angle) * distance;
            }
            particle.startX = particle.x;
            particle.startY = particle.y;
            particle.delay = reducedMotion ? 0 : particle.seed * 320;
          });
          gatherStart = now;
          gathering = !reducedMotion;
        }

        function render(now) {
          context.clearRect(0, 0, width, height);
          context.shadowBlur = reducedMotion ? 0 : 4;
          context.shadowColor = "#c691d5";
          pointer.smoothX += (pointer.x - pointer.smoothX) * 0.18;
          pointer.smoothY += (pointer.y - pointer.smoothY) * 0.18;
          let complete = true;

          particles.forEach((particle) => {
            let x = particle.targetX;
            let y = particle.targetY;

            if (gathering) {
              const progress = clamp((now - gatherStart - particle.delay) / 1450, 0, 1);
              const eased = easeOutCubic(progress);
              x = particle.startX + (particle.targetX - particle.startX) * eased;
              y = particle.startY + (particle.targetY - particle.startY) * eased;
              if (progress < 1) complete = false;
            } else if (!reducedMotion) {
              x += Math.sin(now * 0.0008 + particle.seed * 10) * 0.45 * particle.depth;
              y += Math.cos(now * 0.0007 + particle.depth * 10) * 0.45 * particle.depth;
            }

            if (pointer.active && !reducedMotion) {
              const dx = x - pointer.smoothX;
              const dy = y - pointer.smoothY;
              const distance = Math.hypot(dx, dy);
              if (distance > 0 && distance < 110) {
                const force = Math.pow(1 - distance / 110, 2) * 30;
                x += (dx / distance) * force;
                y += (dy / distance) * force;
              }
            }

            const follow = reducedMotion ? 1 : 0.22;
            particle.x += (x - particle.x) * follow;
            particle.y += (y - particle.y) * follow;
            context.fillStyle = particle.color;
            context.fillRect(particle.x - particle.size / 2, particle.y - particle.size / 2, particle.size, particle.size);
          });

          if (gathering && complete) gathering = false;
          frame = requestAnimationFrame(render);
        }

        async function sampleText() {
          const currentBuild = ++buildId;
          await document.fonts?.ready;
          if (currentBuild !== buildId) return;

          const rect = container.getBoundingClientRect();
          width = Math.floor(rect.width);
          height = Math.floor(rect.height);
          if (!width || !height) return;

          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.floor(width * dpr);
          canvas.height = Math.floor(height * dpr);
          context.setTransform(dpr, 0, 0, dpr, 0, 0);

          const computed = getComputedStyle(container);
          const offscreen = document.createElement("canvas");
          offscreen.width = width;
          offscreen.height = height;
          const offscreenContext = offscreen.getContext("2d", { willReadFrequently: true });
          const lines = width <= 700 ? ["HI, I AM", identity.preferredName.toUpperCase()] : [text.toUpperCase()];
          let fontSize = parseFloat(computed.fontSize);
          const lineHeight = lines.length > 1 ? fontSize * 0.78 : fontSize;
          offscreenContext.font = `${computed.fontWeight} ${fontSize}px ${computed.fontFamily}`;
          const widest = Math.max(...lines.map((line) => offscreenContext.measureText(line).width));
          fontSize *= Math.min(1, width * 0.94 / widest, height * 0.88 / (lineHeight * lines.length));
          const resolvedLineHeight = fontSize * (lines.length > 1 ? 0.78 : 1);
          offscreenContext.font = `${computed.fontWeight} ${fontSize}px ${computed.fontFamily}`;
          offscreenContext.textAlign = "center";
          offscreenContext.textBaseline = "middle";
          offscreenContext.fillStyle = "#fff";
          lines.forEach((line, index) => {
            const y = height / 2 + (index - (lines.length - 1) / 2) * resolvedLineHeight;
            offscreenContext.fillText(line, width / 2, y);
          });

          const data = offscreenContext.getImageData(0, 0, width, height).data;
          const step = width <= 700 ? 4 : 5;
          const targets = [];
          for (let y = 0; y < height; y += step) {
            for (let x = 0; x < width; x += step) {
              if (data[(y * width + x) * 4 + 3] > 40) targets.push({ x, y });

          }
          const stride = Math.max(1, Math.ceil(targets.length / 4200));
          particles = targets.filter((_, index) => index % stride === 0).map((target, index) => {
            const seed = ((index * 9301 + 49297) % 233280) / 233280;
            const depth = 0.45 + (((index * 233 + 97) % 1000) / 1000) * 0.9;
            const mix = clamp(target.x / width + (seed - 0.5) * 0.28, 0, 1);

          });
          pointer.x = pointer.smoothX = width / 2;
          pointer.y = pointer.smoothY = height / 2;
          gather(true);
          if (!frame) frame = requestAnimationFrame(render);
        }

        const movePointer = (event) => {
          const rect = canvas.getBoundingClientRect();
          pointer.x = event.clientX - rect.left;
          pointer.y = event.clientY - rect.top;
          pointer.active = true;
        };
        const queueSample = () => {
          cancelAnimationFrame(resizeFrame);
          resizeFrame = requestAnimationFrame(sampleText);
        };
        const resizeObserver = new ResizeObserver(queueSample);
        resizeObserver.observe(container);
        canvas.addEventListener("pointerenter", movePointer);
        canvas.addEventListener("pointermove", movePointer);
        canvas.addEventListener("pointerleave", () => { pointer.active = false; });
        reducedMotionQuery.addEventListener("change", (event) => { reducedMotion = event.matches; sampleText(); });
        sampleText();
      }

      function initElectricQuestion(button) {
        const canvas = button.querySelector(".question-electric-border");
        const context = canvas.getContext("2d");
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        let frame;
        let width = 0;
        let height = 0;

        const random = (value) => (Math.sin(value * 12.9898) * 43758.5453) % 1;
        const noise = (x, y) => {
          const i = Math.floor(x);
          const j = Math.floor(y);
          const fx = x - i;
          const fy = y - j;
          const ux = fx * fx * (3 - 2 * fx);
          const uy = fy * fy * (3 - 2 * fy);
          const a = random(i + j * 57);
          const b = random(i + 1 + j * 57);
          const c = random(i + (j + 1) * 57);
          const d = random(i + 1 + (j + 1) * 57);
          return a * (1 - ux) * (1 - uy) + b * ux * (1 - uy) + c * (1 - ux) * uy + d * ux * uy;
        };

        function resize() {
          const rect = button.getBoundingClientRect();
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          width = rect.width + 56;
          height = rect.height + 56;
          canvas.width = width * dpr;
          canvas.height = height * dpr;
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
        }

        function draw(now = 0) {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          context.setTransform(dpr, 0, 0, dpr, 0, 0);
          context.clearRect(0, 0, width, height);
          context.strokeStyle = "rgba(180, 151, 207, 0.78)";
          context.shadowColor = "rgba(180, 151, 207, 0.34)";
          context.shadowBlur = 5;
          context.lineWidth = 1;
          context.lineCap = "round";
          context.beginPath();

          const centerX = width / 2;
          const centerY = height / 2;
          const radiusX = (width - 58) / 2;
          const radiusY = (height - 58) / 2;
          const time = now * 0.0006;
          const points = 180;
          for (let index = 0; index <= points; index += 1) {
            const progress = index / points;
            const angle = progress * Math.PI * 2;
            let distortion = 0;
            let amplitude = 0.03;
            let frequency = 8;
            for (let octave = 0; octave < 4; octave += 1) {
              distortion += amplitude * noise(progress * frequency, time * frequency * 0.3 + octave);
              frequency *= 5.0;
              amplitude *= 0.62;
            }
            const displacement = distortion * 60;
            const x = centerX + (radiusX + displacement) * Math.cos(angle);
            const y = centerY + (radiusY + displacement) * Math.sin(angle);
            if (index === 0) context.moveTo(x, y);
            else context.lineTo(x, y);
          }
          context.closePath();
          context.stroke();
          if (!reducedMotion) frame = requestAnimationFrame(draw);
        }

        const resizeObserver = new ResizeObserver(() => {
          cancelAnimationFrame(frame);
          resize();
          draw();
        });
        resizeObserver.observe(button);
        resize();
        draw();

      const particleNoise = (amount = 1) => amount / 2 - Math.random() * amount;
      const getParticleXY = (distance, index, total) => {
        const angle = ((360 + particleNoise(8)) / total) * index * (Math.PI / 180);
        return [distance * Math.cos(angle), distance * Math.sin(angle)];

      function makeQuestionParticles(button) {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

        for (let index = 0; index < particleSettings.count; index += 1) {
          const time = particleSettings.animationTime + particleNoise(particleSettings.timeVariance);
          const start = getParticleXY(particleSettings.distances[0], particleSettings.count - index, particleSettings.count);
          const end = getParticleXY(particleSettings.distances[1] + particleNoise(7), particleSettings.count - index, particleSettings.count);
          const rotateNoise = particleNoise(particleSettings.radius / 10);
          const particle = document.createElement("span");
          const point = document.createElement("span");

          particle.className = "question-particle";
          point.className = "question-particle-point";
          particle.style.setProperty("--start-x", `${start[0]}px`);
          particle.style.setProperty("--start-y", `${start[1]}px`);
          particle.style.setProperty("--end-x", `${end[0]}px`);

          particle.style.setProperty("--particle-time", `${time}ms`);
          particle.style.setProperty("--particle-scale", `${1 + particleNoise(0.2)}`);
          particle.style.setProperty("--particle-color", particleSettings.colors[index % particleSettings.colors.length]);
          particle.style.setProperty("--rotate", `${(rotateNoise > 0 ? rotateNoise + particleSettings.radius / 20 : rotateNoise - particleSettings.radius / 20) * 10}deg`);
          particle.appendChild(point);

        speechBubble.dataset.state = state;
        speechBubble.setAttribute("aria-busy", state === "thinking" ? "true" : "false");
        speechBubble.setAttribute("aria-live", state === "thinking" ? "off" : "polite");
        characterStage.dataset.state = state;
        answerText.textContent = message;
        chatInput.disabled = !profile.ai.enabled || state === "thinking";
        chatSubmit.disabled = !profile.ai.enabled || state === "thinking";
        chatSubmit.setAttribute("aria-label", state === "thinking" ? "Answering question" : "Send question");
        suggestedQuestionList.dataset.state = state;

        if (state === "thinking") {
          let dotCount = 3;
          answerText.textContent = ".".repeat(dotCount);
          thinkingDotsTimer = window.setInterval(() => {
            dotCount = dotCount === 6 ? 3 : dotCount + 1;
            answerText.textContent = ".".repeat(dotCount);
          }, 360);
        }
      }

      function profileIdForSource(source) {
        const prefix = `${source.type}-`;
        return source.id.startsWith(prefix) ? source.id.slice(prefix.length) : null;
      }

      function navigateToProfileId(profileId) {
        const target = profileId ? document.querySelector(`[data-profile-id="${CSS.escape(profileId)}"]`) : null;
        if (!target) return;
        target.scrollIntoView({ behavior: "smooth", block: "center" });
        target.classList.remove("profile-highlight");
        requestAnimationFrame(() => target.classList.add("profile-highlight"));
        window.setTimeout(() => target.classList.remove("profile-highlight"), 1900);
      }

      function renderSources(sources) {
        sourceList.replaceChildren();
        sources.slice(0, 3).forEach((source) => {
          const profileId = profileIdForSource(source);
          const hasTarget = profileId && currentRelatedIds.includes(profileId)
            && document.querySelector(`[data-profile-id="${CSS.escape(profileId)}"]`);
          const chip = document.createElement(hasTarget ? "button" : "span");
          chip.className = "source-chip";
          chip.textContent = source.title;
          if (hasTarget) {
            chip.type = "button";
            chip.addEventListener("click", () => navigateToProfileId(profileId));
          }
          sourceList.append(chip);
        });
      }

      async function askAvatar(question) {
        if (!profile.ai.enabled) return;
        const message = question.trim();
        if (!message || avatarChatState === "thinking") return;
        chatInput.value = message;
        currentRelatedIds = [];
        sourceList.replaceChildren();
        setAvatarChatState("thinking", "...");

        try {
          const apiBaseUrl = (import.meta.env.VITE_API_BASE_URL ?? "").replace(/\/$/, "");
          const response = await fetch(`${apiBaseUrl}/api/chat`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message }),
          });
          if (!response.ok) throw new Error("Chat request failed");
          const result = await response.json();
          if (!result || typeof result.answer !== "string" || !Array.isArray(result.sources)) {
            throw new Error("Unexpected chat response");
          }
          currentRelatedIds = Array.isArray(result.relatedIds)
            ? result.relatedIds.filter((id) => typeof id === "string")
            : [];
          setAvatarChatState("answered", result.answer);
          renderSources(result.sources);
        } catch {
          sourceList.replaceChildren();
          setAvatarChatState("error", "I couldn't answer that just now. Please try again.");
        }
      }

      chatForm.addEventListener("submit", (event) => {
        event.preventDefault();
        askAvatar(chatInput.value);
      });

      document.querySelector("#suggestedQuestions").addEventListener("click", (event) => {
        const button = event.target.closest("[data-question]");
        if (button && avatarChatState !== "thinking") {
          makeQuestionParticles(button);
          askAvatar(button.dataset.question);
        }
      });

      if (!profile.ai.enabled) {
        setAvatarChatState("error", profile.ai.unavailableMessage ?? "AI profile not available yet.");
      }

      function initGhostCursor(host) {
        if (!host) return;

        const isTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0;
        const trailLength = isTouch ? 12 : 18;
        const inertia = 0.08;
        const grainIntensity = 0.045;
        const bloomStrength = 0.18;
        const bloomRadius = 0.8;
        const bloomThreshold = 0.14;
        const brightness = 0.48;
        const edgeIntensity = 0;
        const maxDevicePixelRatio = 0.55;
        const targetPixels = isTouch ? 900000 : 1300000;
        const fadeDelay = isTouch ? 500 : 1000;
        const fadeDuration = isTouch ? 1000 : 1500;

        const vertexShader = `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = vec4(position, 1.0);
          }
        `;

        const fragmentShader = `
          uniform float iTime;
          uniform vec3 iResolution;
          uniform vec2 iMouse;
          uniform vec2 iPrevMouse[MAX_TRAIL_LENGTH];
          uniform float iOpacity;
          uniform float iScale;
          uniform vec3 iBaseColor;
          uniform float iBrightness;
          uniform float iEdgeIntensity;
          varying vec2 vUv;

          float hash(vec2 p) {
            return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
          }

          float noise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            f *= f * (3.0 - 2.0 * f);
            return mix(
              mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), f.x),
              mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x),
              f.y
            );
          }

          float fbm(vec2 p) {
            float v = 0.0;
            float a = 0.5;
            mat2 m = mat2(cos(0.5), sin(0.5), -sin(0.5), cos(0.5));
            for (int i = 0; i < 5; i++) {
              v += a * noise(p);
              p = m * p * 2.0;
              a *= 0.5;
            }
            return v;
          }

          vec4 blob(vec2 p, vec2 mousePos, float intensity, float activity) {
            vec2 q = vec2(
              fbm(p * iScale + iTime * 0.1),
              fbm(p * iScale + vec2(5.2, 1.3) + iTime * 0.1)
            );
            vec2 r = vec2(
              fbm(p * iScale + q * 1.5 + iTime * 0.15),
              fbm(p * iScale + q * 1.5 + vec2(8.3, 2.8) + iTime * 0.15)
            );
            float smoke = fbm(p * iScale + r * 0.8);
            float radius = 0.34 + 0.18 * (1.0 / iScale);
            float distFactor = 1.0 - smoothstep(0.0, radius * activity, length(p - mousePos));
            float alpha = pow(smoke, 2.5) * distFactor;
            vec3 c1 = mix(iBaseColor, vec3(1.0), 0.15);
            vec3 c2 = mix(iBaseColor, vec3(0.8, 0.9, 1.0), 0.25);
            vec3 color = mix(c1, c2, sin(iTime * 0.5) * 0.5 + 0.5);
            return vec4(color * alpha * intensity, alpha * intensity);
          }

          void main() {
            vec2 uv = (gl_FragCoord.xy / iResolution.xy * 2.0 - 1.0) * vec2(iResolution.x / iResolution.y, 1.0);
            vec2 mouse = (iMouse * 2.0 - 1.0) * vec2(iResolution.x / iResolution.y, 1.0);
            vec3 colorAcc = vec3(0.0);
            float alphaAcc = 0.0;

            vec4 currentBlob = blob(uv, mouse, 1.0, iOpacity);
            colorAcc += currentBlob.rgb;
            alphaAcc += currentBlob.a;

            for (int i = 0; i < MAX_TRAIL_LENGTH; i++) {
              vec2 pm = (iPrevMouse[i] * 2.0 - 1.0) * vec2(iResolution.x / iResolution.y, 1.0);
              float t = 1.0 - float(i) / float(MAX_TRAIL_LENGTH);
              t = pow(t, 2.0);
              if (t > 0.01) {
                vec4 trailBlob = blob(uv, pm, t * 0.42, iOpacity);
                colorAcc += trailBlob.rgb;
                alphaAcc += trailBlob.a;
              }
            }

            colorAcc *= iBrightness;
            vec2 uv01 = gl_FragCoord.xy / iResolution.xy;
            float edgeDist = min(min(uv01.x, 1.0 - uv01.x), min(uv01.y, 1.0 - uv01.y));
            float distFromEdge = clamp(edgeDist * 2.0, 0.0, 1.0);
            float edgeMask = mix(1.0 - clamp(iEdgeIntensity, 0.0, 1.0), 1.0, distFromEdge);
            float outAlpha = clamp(alphaAcc * iOpacity * edgeMask, 0.0, 1.0);
            gl_FragColor = vec4(colorAcc, outAlpha);
          }
        `;

        const filmGrainShader = {
          uniforms: {
            tDiffuse: { value: null },
            iTime: { value: 0 },
            intensity: { value: grainIntensity },
          },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D tDiffuse;
            uniform float iTime;
            uniform float intensity;
            varying vec2 vUv;
            float hash1(float n) { return fract(sin(n) * 43758.5453); }
            void main() {
              vec4 color = texture2D(tDiffuse, vUv);
              float n = hash1(vUv.x * 1000.0 + vUv.y * 2000.0 + iTime) * 2.0 - 1.0;
              color.rgb += n * intensity * color.rgb;
              gl_FragColor = color;
            }
          `,
        };

        const unpremultiplyPass = new ShaderPass({
          uniforms: { tDiffuse: { value: null } },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D tDiffuse;
            varying vec2 vUv;
            void main() {
              vec4 c = texture2D(tDiffuse, vUv);
              float coverage = clamp(max(c.r, max(c.g, c.b)), 0.0, 1.0);
              vec3 straight = coverage > 1e-5 ? c.rgb / coverage : vec3(0.0);
              gl_FragColor = vec4(clamp(straight, 0.0, 1.0), coverage);
            }
          `,
        });

        const renderer = new THREE.WebGLRenderer({
          antialias: !isTouch,
          alpha: true,
          depth: false,
          stencil: false,
          powerPreference: isTouch ? "low-power" : "high-performance",
          premultipliedAlpha: false,
          preserveDrawingBuffer: false,
        });
        renderer.setClearColor(0x000000, 0);
        renderer.domElement.style.pointerEvents = "none";
        host.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const geometry = new THREE.PlaneGeometry(2, 2);
        const trailBuffer = Array.from({ length: trailLength }, () => new THREE.Vector2(0.5, 0.5));
        const currentMouse = new THREE.Vector2(0.5, 0.5);
        const velocity = new THREE.Vector2(0, 0);
        let head = 0;
        let pointerActive = false;
        let fadeOpacity = 0;
        let lastMoveTime = performance.now();
        let running = false;
        let raf = null;
        let hasValidSize = false;

        const baseColor = new THREE.Color("#b497cf");
        const material = new THREE.ShaderMaterial({
          defines: { MAX_TRAIL_LENGTH: trailLength },
          uniforms: {
            iTime: { value: 0 },
            iResolution: { value: new THREE.Vector3(1, 1, 1) },
            iMouse: { value: new THREE.Vector2(0.5, 0.5) },
            iPrevMouse: { value: trailBuffer.map((v) => v.clone()) },
            iOpacity: { value: 0 },
            iScale: { value: 1 },
            iBaseColor: { value: new THREE.Vector3(baseColor.r, baseColor.g, baseColor.b) },
            iBrightness: { value: brightness },
            iEdgeIntensity: { value: edgeIntensity },
          },
          vertexShader,
          fragmentShader,
          transparent: true,
          depthTest: false,
          depthWrite: false,
        });

        scene.add(new THREE.Mesh(geometry, material));

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(1, 1), bloomStrength, bloomRadius, bloomThreshold);
        composer.addPass(bloomPass);
        const filmPass = new ShaderPass(filmGrainShader);
        composer.addPass(filmPass);
        composer.addPass(unpremultiplyPass);

        function calculateScale() {
          const base = 600;
          const current = Math.min(Math.max(1, window.innerWidth), Math.max(1, window.innerHeight));
          return Math.max(0.5, Math.min(2, current / base));
        }

        function resizeGhostCursor() {
          const width = Math.floor(window.innerWidth);
          const height = Math.floor(window.innerHeight);
          if (width <= 0 || height <= 0) {
            hasValidSize = false;
            return;
          }

          const currentDpr = Math.min(window.devicePixelRatio || 1, maxDevicePixelRatio);
          const need = width * height * currentDpr * currentDpr;
          const scale = need <= targetPixels ? 1 : Math.max(0.5, Math.min(1, Math.sqrt(targetPixels / Math.max(1, need))));
          const pixelRatio = currentDpr * scale;

          renderer.setPixelRatio(pixelRatio);
          renderer.setSize(width, height, false);
          composer.setPixelRatio?.(pixelRatio);
          composer.setSize(width, height);
          const pixelWidth = Math.max(1, Math.floor(width * pixelRatio));
          const pixelHeight = Math.max(1, Math.floor(height * pixelRatio));
          material.uniforms.iResolution.value.set(pixelWidth, pixelHeight, 1);
          material.uniforms.iScale.value = calculateScale();
          bloomPass.setSize(pixelWidth, pixelHeight);
          hasValidSize = true;
        }

        function animateGhostCursor() {
          if (!hasValidSize) {
            raf = requestAnimationFrame(animateGhostCursor);
            return;
          }

          const now = performance.now();
          const elapsed = now / 1000;

          if (pointerActive) {
            velocity.set(
              currentMouse.x - material.uniforms.iMouse.value.x,
              currentMouse.y - material.uniforms.iMouse.value.y
            );
            material.uniforms.iMouse.value.copy(currentMouse);
            fadeOpacity = 1;
          } else {
            velocity.multiplyScalar(inertia);
            if (velocity.lengthSq() > 1e-6) {
              material.uniforms.iMouse.value.add(velocity);
            }
            const idleTime = now - lastMoveTime;
            if (idleTime > fadeDelay) {
              const k = Math.min(1, (idleTime - fadeDelay) / fadeDuration);
              fadeOpacity = Math.max(0, 1 - k);
            }
          }

          head = (head + 1) % trailBuffer.length;
          trailBuffer[head].copy(material.uniforms.iMouse.value);
          const trailUniform = material.uniforms.iPrevMouse.value;
          for (let i = 0; i < trailBuffer.length; i += 1) {
            const sourceIndex = (head - i + trailBuffer.length) % trailBuffer.length;
            trailUniform[i].copy(trailBuffer[sourceIndex]);
          }

          material.uniforms.iOpacity.value = fadeOpacity;
          material.uniforms.iTime.value = elapsed;
          filmPass.uniforms.iTime.value = elapsed;
          composer.render();

          if (!pointerActive && fadeOpacity <= 0.001) {
            running = false;
            raf = null;
            return;
          }

          raf = requestAnimationFrame(animateGhostCursor);
        }

        function ensureGhostLoop() {
          if (!running) {
            running = true;
            raf = requestAnimationFrame(animateGhostCursor);
          }
        }

        window.addEventListener(
          "pointermove",
          (event) => {
            currentMouse.set(
              THREE.MathUtils.clamp(event.clientX / Math.max(1, window.innerWidth), 0, 1),
              THREE.MathUtils.clamp(1 - event.clientY / Math.max(1, window.innerHeight), 0, 1)
            );
            pointerActive = true;
            lastMoveTime = performance.now();
            ensureGhostLoop();
          },
          { passive: true }
        );

        window.addEventListener(
          "pointerleave",
          () => {
            pointerActive = false;
            lastMoveTime = performance.now();
            ensureGhostLoop();
          },
          { passive: true }
        );

        window.addEventListener("resize", resizeGhostCursor, { passive: true });
        resizeGhostCursor();
      }

      initGhostCursor(document.querySelector("#ghostCursor"));

      const directionalAvatar = profile.avatar.mode === "directional" ? profile.avatar : null;
      const ANGLE_KEYS = directionalAvatar?.directionalFrames ?? [];
      const CENTER_KEY = directionalAvatar?.centerFrame ?? null;
      let activeKey = CENTER_KEY?.key ?? "";

      [...ANGLE_KEYS, ...(CENTER_KEY ? [CENTER_KEY] : [])].forEach((item) => {
        const img = new Image();
        img.src = item.src;
      });

      function angleDistance(a, b) {
        const diff = Math.abs(a - b) % 360;
        return diff > 180 ? 360 - diff : diff;
      }

      function chooseAngleKey(pointerX, pointerY) {
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        const dx = pointerX - centerX;
        const dy = pointerY - centerY;
        const distance = Math.hypot(dx, dy);

        if (!CENTER_KEY || ANGLE_KEYS.length === 0) return CENTER_KEY;
        if (distance < Math.min(window.innerWidth, window.innerHeight) * (directionalAvatar.centerDeadZone ?? 0.13)) {
          return CENTER_KEY;
        }

        const angle = (Math.atan2(dy, dx) * 180) / Math.PI;
        const normalized = (angle + 360) % 360;
        return ANGLE_KEYS.reduce((best, candidate) =>
          angleDistance(candidate.angle, normalized) < angleDistance(best.angle, normalized) ? candidate : best
        );
      }

      function setFrame(next) {
        if (!frameImage || !next || next.key === activeKey) return;
        activeKey = next.key;
        frameImage.src = next.src;
      }

      if (directionalAvatar) {
        window.addEventListener(
          "pointermove",
          (event) => {
            setFrame(chooseAngleKey(event.clientX, event.clientY));
          },
          { passive: true }
        );

        window.addEventListener("pointerleave", () => setFrame(CENTER_KEY));
      }

      const glowCards = document.querySelectorAll(".skill-card, .project-card");

      function getEdgeProximity(card, x, y) {
        const width = card.clientWidth;
        const height = card.clientHeight;
        const cx = width / 2;
        const cy = height / 2;
        const dx = x - cx;
        const dy = y - cy;
        const kx = dx === 0 ? Infinity : cx / Math.abs(dx);
        const ky = dy === 0 ? Infinity : cy / Math.abs(dy);
        return Math.min(Math.max(1 / Math.min(kx, ky), 0), 1);
      }

      function getCursorAngle(card, x, y) {
        const cx = card.clientWidth / 2;
        const cy = card.clientHeight / 2;
        const dx = x - cx;
        const dy = y - cy;
        if (dx === 0 && dy === 0) return 0;
        const degrees = Math.atan2(dy, dx) * (180 / Math.PI) + 90;
        return degrees < 0 ? degrees + 360 : degrees;
      }

      glowCards.forEach((card) => {
        card.addEventListener(
          "pointermove",
          (event) => {
            const rect = card.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            const edge = getEdgeProximity(card, x, y);
            const angle = getCursorAngle(card, x, y);

            card.style.setProperty("--edge-proximity", `${(edge * 100).toFixed(3)}`);
            card.style.setProperty("--cursor-angle", `${angle.toFixed(3)}deg`);
          },
          { passive: true }
        );

        card.addEventListener("pointerleave", () => {
          card.style.setProperty("--edge-proximity", "0");
        });
      });
    </script>
  </body>
</html>
