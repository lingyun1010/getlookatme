<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content=""
    />
    <title>Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/profile/templates/kinetic/kinetic.css" />
    <link rel="stylesheet" href="/src/profile/templates/kinetic/tokens.css" />
  </head>
  <body class="portfolio-page portfolio-template-kinetic" data-profile-template="kinetic">
    <div class="ghost-cursor" id="ghostCursor" aria-hidden="true"></div>
    <main>
      <section class="hero" id="home">
        <nav class="nav" aria-label="Primary navigation">
          <a href="#home">Home</a>
          <a href="#about">About</a>
          <a href="#services">Services</a>
          <a href="#projects">Projects</a>
          <a id="profileChatLink">Chat</a>
          <a href="#contact">Contact</a>
        </nav>

        <div class="hero-title">
          <p class="hero-kicker" id="profileHeadline"></p>
          <h1 class="hero-heading particle-heading" id="profileGreeting">
            <canvas id="profileGreetingCanvas" aria-hidden="true"></canvas>
            <span class="particle-heading-text" id="profileGreetingText"></span>
          </h1>
        </div>

        <div class="character-stage" aria-label="Animated character portrait controlled by pointer direction">
          <div class="character-glow" aria-hidden="true"></div>
          <div class="character-frame-host" id="characterFrameHost" hidden aria-hidden="true"></div>
          <img
            id="characterFrame"
            class="character-frame"
            alt=""
          />
          <div class="character-placeholder" id="characterPlaceholder" hidden aria-hidden="true"></div>
        </div>

        <div class="avatar-chat" aria-label="Ask this portfolio avatar">
          <div class="avatar-speech" id="avatarSpeech" data-state="idle" role="status" aria-live="polite">
            <p id="avatarAnswer">Ask me about my work.</p>
            <div class="source-list" id="avatarSources" aria-label="Answer sources"></div>
            <button class="continue-chat" id="continueChat" type="button">Continue conversation →</button>
          </div>
          <form class="avatar-chat-form" id="avatarChatForm">
            <input id="avatarQuestion" name="message" type="text" maxlength="500" autocomplete="off" placeholder="Ask me anything..." aria-label="Ask a portfolio question" />
            <button type="submit" id="avatarSubmit" aria-label="Send question">→</button>
          </form>
        </div>

        <div class="suggested-questions" id="suggestedQuestions" aria-label="Suggested questions"></div>

        <div class="hero-bottom">
          <p id="profileIntroduction"></p>
          <a class="contact-button" id="profileContactButton">Contact me</a>
        </div>
      </section>

      <section class="content-band" id="work" aria-label="Portfolio highlights"></section>

      <section class="section-dark" id="about">
        <div class="section-head about-copy">
          <h2 class="hero-heading">About me</h2>
          <p id="profileSummary"></p>
        </div>

        <div class="skills-grid" id="profileSkills"></div>
      </section>

      <section class="section-light services" id="services">
        <div class="section-head">
          <h2>Services</h2>
          <p id="profileServicesIntro"></p>
        </div>

        <div class="service-list" id="profileServices"></div>
      </section>

      <section class="section-dark projects" id="projects">
        <div class="section-head">
          <h2 class="hero-heading">Projects</h2>
        </div>

        <div class="project-grid" id="profileProjects"></div>
      </section>

      <section class="section-light" id="experience">
        <div class="experience-layout">
          <div>
            <span class="eyebrow">Professional experience</span>
            <h2 id="profileExperienceSummary"></h2>
          </div>
          <article class="experience-card" id="profileExperience"></article>
        </div>
      </section>

      <section class="section-dark" id="contact">
        <div class="contact-layout">
          <div>
            <span class="eyebrow">Education</span>
            <div id="profileEducation"></div>
          </div>
          <div class="contact-panel">
            <span class="eyebrow">Contact</span>
            <h2 id="profileContactHeading"></h2>
            <a id="profileEmail"></a>
            <span id="profileLocation"></span>
            <a id="profileGitHub" target="_blank" rel="noreferrer">GitHub</a>
            <a id="profileLinkedIn" target="_blank" rel="noreferrer">LinkedIn</a>
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import { LookAtMeAvatar } from "lookatme-avatar/react";
      import { resolveProfile } from "/src/profile/resolveProfile.ts";
      import { featuredEducation, featuredExperience } from "/src/profile/presentation.ts";
      import { isSupabaseConfigured } from "/src/auth/supabase.ts";
      import { askProfile } from "/src/chat/client.ts";
      import { renderEvidenceChips } from "/src/chat/evidence.ts";
      import { transferConversation } from "/src/chat/transfer.ts";
      import { requireAuthenticatedUser } from "/src/auth/session.ts";
      import { loadCurrentUserProfileDocument, loadPublicProfile } from "/src/profile/repository.ts";
      import { trackFunnelEvent } from "/src/analytics/client.ts";
      import * as THREE from "three";
      import { EffectComposer } from "three/examples/jsm/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/examples/jsm/postprocessing/RenderPass.js";
      import { ShaderPass } from "three/examples/jsm/postprocessing/ShaderPass.js";
      import { UnrealBloomPass } from "three/examples/jsm/postprocessing/UnrealBloomPass.js";

      if (window.location.pathname === "/create") {
        window.location.replace("/create.html");
        throw new Error("Opening profile creation flow");
      }
      const requestedSlug = window.location.pathname.replace(/^\/+|\/+$/g, "");
      if (window.location.pathname === "/preview") await requireAuthenticatedUser("/preview");
      const profile = window.location.pathname === "/preview"
        ? await loadCurrentUserProfileDocument()
        : resolveProfile(window.location.pathname) ?? (isSupabaseConfigured && requestedSlug ? await loadPublicProfile(requestedSlug) : null);
      if (!profile) {
        const notFound = document.createElement("main");
        notFound.className = "profile-not-found";
        const heading = document.createElement("h1");
        heading.textContent = "Profile not found";
        const detail = document.createElement("p");
        detail.textContent = "This LookAtMe profile is not published.";
        notFound.append(heading, detail);
        document.body.replaceChildren(notFound);
        throw new Error(`Unknown profile path: ${window.location.pathname}`);
      }
      if (window.location.pathname !== "/preview") void trackFunnelEvent("public_profile_viewed", profile.slug);

      const setText = (id, value) => {
        const element = document.querySelector(`#${id}`);
        if (element) element.textContent = value ?? "";
      };

      const safeExternalUrl = (value) => {
        if (!value) return null;
        try {
          const url = new URL(value, window.location.origin);
          return url.protocol === "http:" || url.protocol === "https:" ? url.href : null;
        } catch {
          return null;
        }
      };

      const identity = profile.identity;
      document.querySelector("#profileChatLink").href = `/${encodeURIComponent(profile.slug)}/chat`;
      const emailHref = identity.email ? `mailto:${identity.email}` : "#contact";
      document.title = profile.seo.title;
      document.querySelector('meta[name="description"]')?.setAttribute("content", profile.seo.description);
      setText("profileHeadline", identity.headline);
      const greeting = `Hi, I am ${identity.preferredName}`;
      setText("profileGreetingText", greeting);
      setText("profileIntroduction", identity.introduction);
      setText("profileSummary", identity.summary);
      setText("profileLocation", identity.location);
      setText("profileEmail", identity.email);
      setText("profileServicesIntro", profile.presentation.servicesIntro);
      setText("profileContactHeading", profile.presentation.contactHeading);
      document.querySelector("#profileEmail")?.setAttribute("href", emailHref);
      document.querySelector("#profileContactButton")?.setAttribute("href", emailHref);
      const setOptionalLink = (selector, url) => {
        const link = document.querySelector(selector);
        if (!link) return;
        const href = safeExternalUrl(url);
        if (href) link.setAttribute("href", href);
        else link.hidden = true;
      };
      setOptionalLink("#profileGitHub", identity.githubUrl);
      setOptionalLink("#profileLinkedIn", identity.linkedinUrl);
      document.querySelector(".avatar-chat")?.setAttribute("aria-label", `Ask ${identity.preferredName}'s portfolio avatar`);
      document.querySelector("#avatarQuestion")?.setAttribute("aria-label", `Ask ${identity.preferredName} a question`);

      const frameImage = document.querySelector("#characterFrame");
      const characterPlaceholder = document.querySelector("#characterPlaceholder");
      const frameHost = document.querySelector("#characterFrameHost");
      const avatarRoot = frameHost ? createRoot(frameHost) : null;
      frameImage.setAttribute("alt", profile.avatar.alt);
      const renderOriginalAvatar = () => {
        const imageUrl = profile.avatarImageUrl;
        frameHost?.setAttribute("hidden", "true");
        frameHost?.setAttribute("aria-hidden", "true");
        if (imageUrl) {
          article.classList.add("has-media");
          frameImage.src = imageUrl;
          frameImage.style.objectFit = "cover";
          frameImage.style.objectPosition = "center center";
          frameImage.hidden = false;
        } else {
          frameImage.hidden = true;
        }
        characterPlaceholder.hidden = true;
        characterPlaceholder.setAttribute("aria-hidden", "true");
      };
      if (profile.avatarMode === "dynamic" && profile.avatarFrameSet) {
        frameImage.hidden = true;
        characterPlaceholder.hidden = true;
        characterPlaceholder.setAttribute("aria-hidden", "true");
        if (frameHost) {
          frameHost.hidden = false;
          frameHost.removeAttribute("aria-hidden");
          avatarRoot?.render(
            React.createElement(LookAtMeAvatar, {
              frames: profile.avatarFrameSet,
              width: "100%",
              height: "100%",
              size: 520,
              objectFit: "contain",
              alt: profile.avatar.alt ?? `${identity.preferredName}'s dynamic avatar`,
              deadZone: 0.12,
            })
          );
        }
      } else if (profile.avatarMode === "original" && profile.avatarImageUrl) {
        renderOriginalAvatar();
      } else if (profile.avatar.mode === "directional") {
        frameImage.hidden = false;
        frameHost?.setAttribute("hidden", "true");
        frameHost?.setAttribute("aria-hidden", "true");
        frameImage.src = profile.avatar.centerFrame.src;
        frameImage.style.objectFit = profile.avatar.presentation?.objectFit ?? "contain";
        frameImage.style.objectPosition = profile.avatar.presentation?.objectPosition ?? "center bottom";
      } else {
        frameImage.hidden = true;
        characterPlaceholder.hidden = false;
        characterPlaceholder.textContent = profile.avatar.initials;
        characterPlaceholder.setAttribute("aria-label", profile.avatar.alt);
        characterPlaceholder.removeAttribute("aria-hidden");
      }

      function initParticleHeading(container, canvas, text) {
        const context = canvas.getContext("2d");
        if (!context) return;

        const reducedMotionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
        let reducedMotion = reducedMotionQuery.matches;
        let particles = [];
        let frame;
        let resizeFrame;
        let buildId = 0;
        let width = 0;
        let height = 0;
        let gatherStart = 0;
        let gathering = false;
        const pointer = { active: false, x: 0, y: 0, smoothX: 0, smoothY: 0 };
        const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
        const easeOutCubic = (value) => 1 - Math.pow(1 - value, 3);

        function gather(scatter = true) {
          const now = performance.now();
          particles.forEach((particle) => {
            if (scatter && !reducedMotion) {
              const angle = particle.seed * Math.PI * 2;
              const distance = 140 * (0.4 + particle.depth * 0.7);
              particle.x = particle.targetX + Math.cos(angle) * distance;
              particle.y = particle.targetY + Math.sin(angle) * distance;
            }
            particle.startX = particle.x;
            particle.startY = particle.y;
            particle.delay = reducedMotion ? 0 : particle.seed * 320;
          });
          gatherStart = now;
          gathering = !reducedMotion;
        }

        function render(now) {
          context.clearRect(0, 0, width, height);
          context.shadowBlur = reducedMotion ? 0 : 4;
          context.shadowColor = "#c691d5";
          pointer.smoothX += (pointer.x - pointer.smoothX) * 0.18;
          pointer.smoothY += (pointer.y - pointer.smoothY) * 0.18;
          let complete = true;

          particles.forEach((particle) => {
            let x = particle.targetX;
            let y = particle.targetY;

            if (gathering) {
              const progress = clamp((now - gatherStart - particle.delay) / 1450, 0, 1);
              const eased = easeOutCubic(progress);
              x = particle.startX + (particle.targetX - particle.startX) * eased;
              y = particle.startY + (particle.targetY - particle.startY) * eased;
              if (progress < 1) complete = false;
            } else if (!reducedMotion) {
              x += Math.sin(now * 0.0008 + particle.seed * 10) * 0.45 * particle.depth;
              y += Math.cos(now * 0.0007 + particle.depth * 10) * 0.45 * particle.depth;
            }

            if (pointer.active && !reducedMotion) {
              const dx = x - pointer.smoothX;
              const dy = y - pointer.smoothY;
              const distance = Math.hypot(dx, dy);
              if (distance > 0 && distance < 110) {
                const force = Math.pow(1 - distance / 110, 2) * 30;
                x += (dx / distance) * force;
                y += (dy / distance) * force;
              }
            }

            const follow = reducedMotion ? 1 : 0.22;
            particle.x += (x - particle.x) * follow;
            particle.y += (y - particle.y) * follow;
            context.fillStyle = particle.color;
            context.fillRect(particle.x - particle.size / 2, particle.y - particle.size / 2, particle.size, particle.size);
          });

          if (gathering && complete) gathering = false;
          frame = requestAnimationFrame(render);
        }

        async function sampleText() {
          const currentBuild = ++buildId;
          await document.fonts?.ready;
          if (currentBuild !== buildId) return;

          const rect = container.getBoundingClientRect();
          width = Math.floor(rect.width);
          height = Math.floor(rect.height);
          if (!width || !height) return;

          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.floor(width * dpr);
          canvas.height = Math.floor(height * dpr);
          context.setTransform(dpr, 0, 0, dpr, 0, 0);

          const computed = getComputedStyle(container);
          const offscreen = document.createElement("canvas");
          offscreen.width = width;
          offscreen.height = height;
          const offscreenContext = offscreen.getContext("2d", { willReadFrequently: true });
          const lines = width <= 700 ? ["HI, I AM", identity.preferredName.toUpperCase()] : [text.toUpperCase()];
          let fontSize = parseFloat(computed.fontSize);
          const lineHeight = lines.length > 1 ? fontSize * 0.78 : fontSize;
          offscreenContext.font = `${computed.fontWeight} ${fontSize}px ${computed.fontFamily}`;
          const widest = Math.max(...lines.map((line) => offscreenContext.measureText(line).width));
          fontSize *= Math.min(1, width * 0.94 / widest, height * 0.88 / (lineHeight * lines.length));
          const resolvedLineHeight = fontSize * (lines.length > 1 ? 0.78 : 1);
          offscreenContext.font = `${computed.fontWeight} ${fontSize}px ${computed.fontFamily}`;
          offscreenContext.textAlign = "center";
          offscreenContext.textBaseline = "middle";
          offscreenContext.fillStyle = "#fff";
          lines.forEach((line, index) => {
            const y = height / 2 + (index - (lines.length - 1) / 2) * resolvedLineHeight;
            offscreenContext.fillText(line, width / 2, y);
          });

          const data = offscreenContext.getImageData(0, 0, width, height).data;
          const step = width <= 700 ? 4 : 5;
          const targets = [];
          for (let y = 0; y < height; y += step) {
            for (let x = 0; x < width; x += step) {
              if (data[(y * width + x) * 4 + 3] > 40) targets.push({ x, y });
            }
          }
          const stride = Math.max(1, Math.ceil(targets.length / 4200));
          particles = targets.filter((_, index) => index % stride === 0).map((target, index) => {
            const seed = ((index * 9301 + 49297) % 233280) / 233280;
            const depth = 0.45 + (((index * 233 + 97) % 1000) / 1000) * 0.9;
            const mix = clamp(target.x / width + (seed - 0.5) * 0.28, 0, 1);
            const color = `rgb(${Math.round(187 + (198 - 187) * mix)}, ${Math.round(204 + (145 - 204) * mix)}, ${Math.round(215 + (213 - 215) * mix)})`;
            return { ...target, targetX: target.x, targetY: target.y, startX: target.x, startY: target.y, size: 1.5 + depth * 0.35, color, seed, depth, delay: 0 };
          });
          pointer.x = pointer.smoothX = width / 2;
          pointer.y = pointer.smoothY = height / 2;
          gather(true);
          if (!frame) frame = requestAnimationFrame(render);
        }

        const movePointer = (event) => {
          const rect = canvas.getBoundingClientRect();
          pointer.x = event.clientX - rect.left;
          pointer.y = event.clientY - rect.top;
          pointer.active = true;
        };
        const queueSample = () => {
          cancelAnimationFrame(resizeFrame);
          resizeFrame = requestAnimationFrame(sampleText);
        };
        const resizeObserver = new ResizeObserver(queueSample);
        resizeObserver.observe(container);
        canvas.addEventListener("pointerenter", movePointer);
        canvas.addEventListener("pointermove", movePointer);
        canvas.addEventListener("pointerleave", () => { pointer.active = false; });
        reducedMotionQuery.addEventListener("change", (event) => { reducedMotion = event.matches; sampleText(); });
        sampleText();
      }

      initParticleHeading(
        document.querySelector("#profileGreeting"),
        document.querySelector("#profileGreetingCanvas"),
        greeting,
      );

      const highlightNodes = profile.highlights.map((item, index) => {
        const article = document.createElement("article");
        article.className = "reveal-on-scroll";
        article.style.setProperty("--reveal-delay", `${index * 110}ms`);
        article.dataset.profileId = item.id;
        if (item.anchorId) article.id = item.anchorId;
        const title = document.createElement("h2");
        title.textContent = item.title;
        const description = document.createElement("p");
        description.textContent = item.description;
        article.append(title, description);
        return article;
      });
      document.querySelector("#work")?.replaceChildren(...highlightNodes);

      const marqueeNodes = [...profile.focusAreas, ...profile.focusAreas].map((item) => {
        const label = document.createElement("span");
        label.textContent = item;
        return label;
      });
      document.querySelector("#profileMarquee")?.replaceChildren(...marqueeNodes);

      const skillNodes = profile.skills.flatMap((group) => group.items).map((item, index) => {
        const article = document.createElement("article");
        article.className = "skill-card reveal-on-scroll";
        article.style.setProperty("--reveal-delay", `${index * 90}ms`);
        article.dataset.profileId = `skill-${index + 1}`;
        const edge = document.createElement("span");
        edge.className = "edge-light";
        edge.setAttribute("aria-hidden", "true");
        const label = document.createElement("span");
        label.textContent = item;
        article.append(edge, label);
        return article;
      });
      document.querySelector("#profileSkills")?.replaceChildren(...skillNodes);

      const serviceNodes = profile.services.map((service, index) => {
        const article = document.createElement("article");
        article.className = "service-item";
        article.dataset.profileId = service.id;
        const number = document.createElement("span");
        number.textContent = String(index + 1).padStart(2, "0");
        const copy = document.createElement("div");
        const title = document.createElement("h3");
        title.textContent = service.name;
        const description = document.createElement("p");
        description.textContent = service.description;
        copy.append(title, description);
        article.append(number, copy);
        return article;
      });
      document.querySelector("#profileServices")?.replaceChildren(...serviceNodes);

      const projectNodes = profile.projects.map((project, index) => {
        const article = document.createElement("article");
        article.className = "project-card";
        article.dataset.profileId = project.id;
        article.style.setProperty("--stack-index", String(index));
        const edge = document.createElement("span");
        edge.className = "edge-light";
        edge.setAttribute("aria-hidden", "true");
        const number = document.createElement("span");
        number.className = "project-number";
        number.textContent = String(index + 1).padStart(2, "0");
        article.append(edge, number);

        const imageUrl = safeExternalUrl(project.image);
        if (imageUrl) {
          const firstProjectUrl = safeExternalUrl(project.links?.[0]?.url);
          const media = document.createElement(firstProjectUrl ? "a" : "div");
          media.className = "project-media";
          if (firstProjectUrl) {
            media.href = firstProjectUrl;
            media.target = "_blank";
            media.rel = "noreferrer";
          }
          const image = document.createElement("img");
          image.src = imageUrl;
          image.alt = project.imageAlt ?? project.title;
          image.loading = "lazy";
          image.addEventListener("error", () => { media.remove(); article.classList.remove("has-media"); });
          media.append(image);
          article.append(media);
        }

        const category = document.createElement("p");
        category.className = "project-type";
        category.textContent = project.category;
        const title = document.createElement("h3");
        title.textContent = project.title;
        const description = document.createElement("p");
        description.textContent = project.shortDescription;
        const tags = document.createElement("div");
        tags.className = "tags";
        (project.tags ?? []).forEach((tag) => {
          const label = document.createElement("span");
          label.textContent = tag;
          tags.append(label);
        });
        const links = document.createElement("div");
        links.className = "project-links";
        (project.links ?? []).forEach((link) => {
          const href = safeExternalUrl(link.url);
          if (!href) return;
          const anchor = document.createElement("a");
          anchor.href = href;
          anchor.target = "_blank";
          anchor.rel = "noreferrer";
          anchor.textContent = `${link.label} ↗`;
          links.append(anchor);
        });
        article.append(category, title, description, tags, links);
        return article;
      });
      document.querySelector("#profileProjects")?.replaceChildren(...projectNodes);

      const projectCards = [...document.querySelectorAll(".project-card")];
      const projectMotionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
      let projectStackFrame = 0;

      function updateProjectStack() {
        projectStackFrame = 0;
        if (projectMotionQuery.matches) {
          projectCards.forEach((card) => { card.style.transform = "none"; });
          return;
        }

        let activeIndex = 0;
        projectCards.forEach((card, index) => {
          const stickyTop = Number.parseFloat(getComputedStyle(card).top) || 0;
          if (card.getBoundingClientRect().top <= stickyTop + 1) activeIndex = index;
        });

        projectCards.forEach((card, index) => {
          const depth = Math.max(0, activeIndex - index);
          card.style.transform = `scale(${Math.max(0.88, 1 - depth * 0.028)})`;
        });
      }

      function requestProjectStackUpdate() {
        if (!projectStackFrame) projectStackFrame = requestAnimationFrame(updateProjectStack);
      }

      window.addEventListener("scroll", requestProjectStackUpdate, { passive: true });
      window.addEventListener("resize", requestProjectStackUpdate, { passive: true });
      projectMotionQuery.addEventListener("change", requestProjectStackUpdate);
      updateProjectStack();

      const aboutSummary = document.querySelector("#profileSummary");
      if (aboutSummary) {
        const summaryText = aboutSummary.textContent;
        const letterSequence = document.createElement("span");
        letterSequence.setAttribute("aria-hidden", "true");
        let letterIndex = 0;
        Array.from(summaryText).forEach((character) => {
          if (/\s/.test(character)) {
            letterSequence.append(character);
            return;
          }
          const letter = document.createElement("span");
          letter.className = "about-letter";
          letter.textContent = character;
          letter.style.setProperty("--letter-delay", `${150 + letterIndex * 8}ms`);
          letterSequence.append(letter);
          letterIndex += 1;
        });
        aboutSummary.setAttribute("aria-label", summaryText);
        aboutSummary.replaceChildren(letterSequence);
      }

      const revealTargets = document.querySelectorAll(".reveal-on-scroll, .about-copy");
      document.documentElement.classList.add("motion-ready");
      let previousRevealScrollY = window.scrollY;
      let isRevealScrollingDown = true;

      window.addEventListener("scroll", () => {
        const nextScrollY = window.scrollY;
        if (Math.abs(nextScrollY - previousRevealScrollY) > 2) {
          isRevealScrollingDown = nextScrollY > previousRevealScrollY;
          previousRevealScrollY = nextScrollY;
        }
      }, { passive: true });

      if ("IntersectionObserver" in window) {
        const revealObserver = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting && isRevealScrollingDown) {
              entry.target.classList.add("is-visible");
              return;
            }

            const exitedBelowViewport = !entry.isIntersecting
              && !isRevealScrollingDown
              && entry.boundingClientRect.top >= window.innerHeight * 0.86;
            if (exitedBelowViewport) entry.target.classList.remove("is-visible");
          });
        }, { threshold: 0.14, rootMargin: "0px 0px -10%" });

        revealTargets.forEach((target) => revealObserver.observe(target));
      } else {
        revealTargets.forEach((target) => target.classList.add("is-visible"));
      }

      const experience = profile.experience.length ? featuredExperience(profile) : undefined;
      const experienceCard = document.querySelector("#profileExperience");
      if (experience) {
        setText("profileExperienceSummary", experience.summary);
        experienceCard.dataset.profileId = experience.id;
        const experiencePeriod = document.createElement("p");
        experiencePeriod.className = "period";
        experiencePeriod.textContent = [
          [experience.startDate, experience.endDate].filter(Boolean).join(" - "),
          experience.location,
        ].filter(Boolean).join(" | ");
        const experienceRole = document.createElement("h3");
        experienceRole.textContent = experience.role;
        const experienceCompany = document.createElement("p");
        experienceCompany.textContent = experience.company;
        const experienceHighlights = document.createElement("ul");
        (experience.highlights ?? []).forEach((highlight) => {

        });
        experienceCard.replaceChildren(experiencePeriod, experienceRole, experienceCompany, experienceHighlights);
      } else {
        setText("profileExperienceSummary", "Experience not provided");
        experienceCard.textContent = "Add experience from the profile creation screen.";

      const educationLine = (item) => [item.institution, item.description, item.honours, `${item.startDate} - ${item.endDate}`]
        .filter(Boolean).join(" | ");
      const primaryEducation = profile.education.length ? featuredEducation(profile) : undefined;
      const educationContainer = document.querySelector("#profileEducation");
      const educationNodes = profile.education.map((item) => {
        const record = document.createElement("div");
        record.dataset.profileId = item.id;
        const isFeatured = item.id === primaryEducation?.id;
        if (isFeatured) {
          const degree = document.createElement("h2");

        record.append(detail);

      });
      if (educationNodes.length) educationContainer.replaceChildren(...educationNodes);
      else educationContainer.textContent = "Education not provided.";

      const suggestedQuestions = profile.suggestedQuestions;

      const chatForm = document.querySelector("#avatarChatForm");
      const chatInput = document.querySelector("#avatarQuestion");
      const chatSubmit = document.querySelector("#avatarSubmit");
      const speechBubble = document.querySelector("#avatarSpeech");
      const answerText = document.querySelector("#avatarAnswer");
      const sourceList = document.querySelector("#avatarSources");
      const continueChat = document.querySelector("#continueChat");
      const characterStage = document.querySelector(".character-stage");
      const suggestedQuestionList = document.querySelector("#suggestedQuestions");
      /** @typedef {"idle" | "thinking" | "answered" | "error"} AvatarChatState */
      /** @type {AvatarChatState} */
      let avatarChatState = "idle";
      let currentRelatedIds = [];
      let currentConversation = [];
      let thinkingDotsTimer = 0;

      const questionButtons = suggestedQuestions.map((question) => {
        const button = document.createElement("button");
        button.className = "question-chip";
        button.type = "button";
        button.dataset.question = question;
        button.disabled = !profile.ai.enabled;
        const canvas = document.createElement("canvas");
        canvas.className = "question-electric-border";
        canvas.setAttribute("aria-hidden", "true");
        const label = document.createElement("span");
        label.className = "question-chip-label";
        label.textContent = question;
        button.append(canvas, label);
        return button;
      });
      suggestedQuestionList.replaceChildren(...questionButtons);

      function initElectricQuestion(button) {
        const canvas = button.querySelector(".question-electric-border");
        const context = canvas.getContext("2d");
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        let frame;
        let width = 0;
        let height = 0;

        const random = (value) => (Math.sin(value * 12.9898) * 43758.5453) % 1;
        const noise = (x, y) => {
          const i = Math.floor(x);
          const j = Math.floor(y);
          const fx = x - i;
          const fy = y - j;
          const ux = fx * fx * (3 - 2 * fx);
          const uy = fy * fy * (3 - 2 * fy);
          const a = random(i + j * 57);
          const b = random(i + 1 + j * 57);
          const c = random(i + (j + 1) * 57);
          const d = random(i + 1 + (j + 1) * 57);
          return a * (1 - ux) * (1 - uy) + b * ux * (1 - uy) + c * (1 - ux) * uy + d * ux * uy;
        };

        function resize() {
          const rect = button.getBoundingClientRect();
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          width = rect.width + 56;
          height = rect.height + 56;
          canvas.width = width * dpr;
          canvas.height = height * dpr;
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
        }

        function draw(now = 0) {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          context.setTransform(dpr, 0, 0, dpr, 0, 0);
          context.clearRect(0, 0, width, height);
          context.strokeStyle = "rgba(180, 151, 207, 0.78)";
          context.shadowColor = "rgba(180, 151, 207, 0.34)";
          context.shadowBlur = 5;
          context.lineWidth = 1;
          context.lineCap = "round";
          context.beginPath();

          const centerX = width / 2;
          const centerY = height / 2;
          const radiusX = (width - 58) / 2;
          const radiusY = (height - 58) / 2;
          const time = now * 0.0006;
          const points = 180;
          for (let index = 0; index <= points; index += 1) {
            const progress = index / points;
            const angle = progress * Math.PI * 2;
            let distortion = 0;
            let amplitude = 0.03;
            let frequency = 8;
            for (let octave = 0; octave < 4; octave += 1) {
              distortion += amplitude * noise(progress * frequency, time * frequency * 0.3 + octave);
              frequency *= 5.0;
              amplitude *= 0.62;
            }
            const displacement = distortion * 60;
            const x = centerX + (radiusX + displacement) * Math.cos(angle);
            const y = centerY + (radiusY + displacement) * Math.sin(angle);
            if (index === 0) context.moveTo(x, y);
            else context.lineTo(x, y);
          }
          context.closePath();
          context.stroke();
          if (!reducedMotion) frame = requestAnimationFrame(draw);
        }

        const resizeObserver = new ResizeObserver(() => {
          cancelAnimationFrame(frame);
          resize();
          draw();
        });
        resizeObserver.observe(button);
        resize();
        draw();
      }

      document.querySelectorAll(".question-chip").forEach(initElectricQuestion);

      const particleSettings = {
        count: 12,
        distances: [72, 11],
        radius: 130,
        animationTime: 520,
        timeVariance: 280,
        colors: ["#d99acb", "#b497cf", "#8f78ad", "#e7dce4"],
      };

      const particleNoise = (amount = 1) => amount / 2 - Math.random() * amount;
      const getParticleXY = (distance, index, total) => {
        const angle = ((360 + particleNoise(8)) / total) * index * (Math.PI / 180);
        return [distance * Math.cos(angle), distance * Math.sin(angle)];
      };

      function makeQuestionParticles(button) {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

        for (let index = 0; index < particleSettings.count; index += 1) {
          const time = particleSettings.animationTime + particleNoise(particleSettings.timeVariance);
          const start = getParticleXY(particleSettings.distances[0], particleSettings.count - index, particleSettings.count);
          const end = getParticleXY(particleSettings.distances[1] + particleNoise(7), particleSettings.count - index, particleSettings.count);
          const rotateNoise = particleNoise(particleSettings.radius / 10);
          const particle = document.createElement("span");
          const point = document.createElement("span");

          particle.className = "question-particle";
          point.className = "question-particle-point";
          particle.style.setProperty("--start-x", `${start[0]}px`);
          particle.style.setProperty("--start-y", `${start[1]}px`);
          particle.style.setProperty("--end-x", `${end[0]}px`);
          particle.style.setProperty("--end-y", `${end[1]}px`);
          particle.style.setProperty("--particle-time", `${time}ms`);
          particle.style.setProperty("--particle-scale", `${1 + particleNoise(0.2)}`);
          particle.style.setProperty("--particle-color", particleSettings.colors[index % particleSettings.colors.length]);
          particle.style.setProperty("--rotate", `${(rotateNoise > 0 ? rotateNoise + particleSettings.radius / 20 : rotateNoise - particleSettings.radius / 20) * 10}deg`);
          particle.appendChild(point);
          button.appendChild(particle);
          window.setTimeout(() => particle.remove(), time);
        }
      }

      function setAvatarChatState(state, message) {
        window.clearInterval(thinkingDotsTimer);
        thinkingDotsTimer = 0;
        avatarChatState = state;
        speechBubble.dataset.state = state;
        speechBubble.setAttribute("aria-busy", state === "thinking" ? "true" : "false");
        speechBubble.setAttribute("aria-live", state === "thinking" ? "off" : "polite");
        characterStage.dataset.state = state;
        answerText.textContent = message;
        chatInput.disabled = !profile.ai.enabled || state === "thinking";
        chatSubmit.disabled = !profile.ai.enabled || state === "thinking";
        chatSubmit.setAttribute("aria-label", state === "thinking" ? "Answering question" : "Send question");
        suggestedQuestionList.dataset.state = state;

        if (state === "thinking") {
          let dotCount = 3;
          answerText.textContent = ".".repeat(dotCount);
          thinkingDotsTimer = window.setInterval(() => {
            dotCount = dotCount === 6 ? 3 : dotCount + 1;
            answerText.textContent = ".".repeat(dotCount);
          }, 360);
        }
      }

      function renderSources(sources) {
        renderEvidenceChips(sourceList, sources);
      }

      async function askAvatar(question) {
        if (!profile.ai.enabled) return;
        const message = question.trim();
        if (!message || avatarChatState === "thinking") return;
        chatInput.value = message;
        currentRelatedIds = [];
        sourceList.replaceChildren();
        setAvatarChatState("thinking", "...");

        try {
          const result = await askProfile(profile.slug, message, [], window.location.pathname === "/preview");
          currentRelatedIds = Array.isArray(result.relatedIds)
            ? result.relatedIds.filter((id) => typeof id === "string")
            : [];
          setAvatarChatState("answered", result.answer);
          renderSources(result.sources);
          currentConversation = [
            { id: crypto.randomUUID(), role: "user", content: message },
            { id: crypto.randomUUID(), role: "assistant", content: result.answer, evidence: result.evidence, sources: result.sources, relatedIds: result.relatedIds },
          ];
          continueChat.hidden = false;
        } catch {
          sourceList.replaceChildren();
          setAvatarChatState("error", "I couldn't answer that just now. Please try again.");
        }
      }

      chatForm.addEventListener("submit", (event) => {
        event.preventDefault();
        askAvatar(chatInput.value);
      });

      continueChat.addEventListener("click", () => transferConversation(profile.slug, currentConversation));

      document.querySelector("#suggestedQuestions").addEventListener("click", (event) => {
        const button = event.target.closest("[data-question]");
        if (button && avatarChatState !== "thinking") {
          makeQuestionParticles(button);
          askAvatar(button.dataset.question);
        }
      });

      if (!profile.ai.enabled) {
        setAvatarChatState("error", profile.ai.unavailableMessage ?? "AI profile not available yet.");
      }

      function initGhostCursor(host) {
        if (!host) return;

        const isTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0;
        const trailLength = isTouch ? 12 : 18;
        const inertia = 0.08;
        const grainIntensity = 0.045;
        const bloomStrength = 0.18;
        const bloomRadius = 0.8;
        const bloomThreshold = 0.14;
        const brightness = 0.48;
        const edgeIntensity = 0;
        const maxDevicePixelRatio = 0.55;
        const targetPixels = isTouch ? 900000 : 1300000;
        const fadeDelay = isTouch ? 500 : 1000;
        const fadeDuration = isTouch ? 1000 : 1500;

        const vertexShader = `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = vec4(position, 1.0);
          }
        `;

        const fragmentShader = `
          uniform float iTime;
          uniform vec3 iResolution;
          uniform vec2 iMouse;
          uniform vec2 iPrevMouse[MAX_TRAIL_LENGTH];
          uniform float iOpacity;
          uniform float iScale;
          uniform vec3 iBaseColor;
          uniform float iBrightness;
          uniform float iEdgeIntensity;
          varying vec2 vUv;

          float hash(vec2 p) {
            return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
          }

          float noise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            f *= f * (3.0 - 2.0 * f);
            return mix(
              mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), f.x),
              mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x),
              f.y
            );
          }

          float fbm(vec2 p) {
            float v = 0.0;
            float a = 0.5;
            mat2 m = mat2(cos(0.5), sin(0.5), -sin(0.5), cos(0.5));
            for (int i = 0; i < 5; i++) {
              v += a * noise(p);
              p = m * p * 2.0;
              a *= 0.5;
            }
            return v;
          }

          vec4 blob(vec2 p, vec2 mousePos, float intensity, float activity) {
            vec2 q = vec2(
              fbm(p * iScale + iTime * 0.1),
              fbm(p * iScale + vec2(5.2, 1.3) + iTime * 0.1)
            );
            vec2 r = vec2(
              fbm(p * iScale + q * 1.5 + iTime * 0.15),
              fbm(p * iScale + q * 1.5 + vec2(8.3, 2.8) + iTime * 0.15)
            );
            float smoke = fbm(p * iScale + r * 0.8);
            float radius = 0.34 + 0.18 * (1.0 / iScale);
            float distFactor = 1.0 - smoothstep(0.0, radius * activity, length(p - mousePos));
            float alpha = pow(smoke, 2.5) * distFactor;
            vec3 c1 = mix(iBaseColor, vec3(1.0), 0.15);
            vec3 c2 = mix(iBaseColor, vec3(0.8, 0.9, 1.0), 0.25);
            vec3 color = mix(c1, c2, sin(iTime * 0.5) * 0.5 + 0.5);
            return vec4(color * alpha * intensity, alpha * intensity);
          }

          void main() {
            vec2 uv = (gl_FragCoord.xy / iResolution.xy * 2.0 - 1.0) * vec2(iResolution.x / iResolution.y, 1.0);
            vec2 mouse = (iMouse * 2.0 - 1.0) * vec2(iResolution.x / iResolution.y, 1.0);
            vec3 colorAcc = vec3(0.0);
            float alphaAcc = 0.0;

            vec4 currentBlob = blob(uv, mouse, 1.0, iOpacity);
            colorAcc += currentBlob.rgb;
            alphaAcc += currentBlob.a;

            for (int i = 0; i < MAX_TRAIL_LENGTH; i++) {
              vec2 pm = (iPrevMouse[i] * 2.0 - 1.0) * vec2(iResolution.x / iResolution.y, 1.0);
              float t = 1.0 - float(i) / float(MAX_TRAIL_LENGTH);
              t = pow(t, 2.0);
              if (t > 0.01) {
                vec4 trailBlob = blob(uv, pm, t * 0.42, iOpacity);
                colorAcc += trailBlob.rgb;
                alphaAcc += trailBlob.a;
              }
            }

            colorAcc *= iBrightness;
            vec2 uv01 = gl_FragCoord.xy / iResolution.xy;
            float edgeDist = min(min(uv01.x, 1.0 - uv01.x), min(uv01.y, 1.0 - uv01.y));
            float distFromEdge = clamp(edgeDist * 2.0, 0.0, 1.0);
            float edgeMask = mix(1.0 - clamp(iEdgeIntensity, 0.0, 1.0), 1.0, distFromEdge);
            float outAlpha = clamp(alphaAcc * iOpacity * edgeMask, 0.0, 1.0);
            gl_FragColor = vec4(colorAcc, outAlpha);
          }
        `;

        const filmGrainShader = {
          uniforms: {
            tDiffuse: { value: null },
            iTime: { value: 0 },
            intensity: { value: grainIntensity },
          },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D tDiffuse;
            uniform float iTime;
            uniform float intensity;
            varying vec2 vUv;
            float hash1(float n) { return fract(sin(n) * 43758.5453); }
            void main() {
              vec4 color = texture2D(tDiffuse, vUv);
              float n = hash1(vUv.x * 1000.0 + vUv.y * 2000.0 + iTime) * 2.0 - 1.0;
              color.rgb += n * intensity * color.rgb;
              gl_FragColor = color;
            }
          `,
        };

        const unpremultiplyPass = new ShaderPass({
          uniforms: { tDiffuse: { value: null } },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D tDiffuse;
            varying vec2 vUv;
            void main() {
              vec4 c = texture2D(tDiffuse, vUv);
              float coverage = clamp(max(c.r, max(c.g, c.b)), 0.0, 1.0);
              vec3 straight = coverage > 1e-5 ? c.rgb / coverage : vec3(0.0);
              gl_FragColor = vec4(clamp(straight, 0.0, 1.0), coverage);
            }
          `,
        });

        const renderer = new THREE.WebGLRenderer({
          antialias: !isTouch,
          alpha: true,
          depth: false,
          stencil: false,
          powerPreference: isTouch ? "low-power" : "high-performance",
          premultipliedAlpha: false,
          preserveDrawingBuffer: false,
        });
        renderer.setClearColor(0x000000, 0);
        renderer.domElement.style.pointerEvents = "none";
        host.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const geometry = new THREE.PlaneGeometry(2, 2);
        const trailBuffer = Array.from({ length: trailLength }, () => new THREE.Vector2(0.5, 0.5));
        const currentMouse = new THREE.Vector2(0.5, 0.5);
        const velocity = new THREE.Vector2(0, 0);
        let head = 0;
        let pointerActive = false;
        let fadeOpacity = 0;
        let lastMoveTime = performance.now();
        let running = false;
        let raf = null;
        let hasValidSize = false;

        const baseColor = new THREE.Color("#b497cf");
        const material = new THREE.ShaderMaterial({
          defines: { MAX_TRAIL_LENGTH: trailLength },
          uniforms: {
            iTime: { value: 0 },
            iResolution: { value: new THREE.Vector3(1, 1, 1) },
            iMouse: { value: new THREE.Vector2(0.5, 0.5) },
            iPrevMouse: { value: trailBuffer.map((v) => v.clone()) },
            iOpacity: { value: 0 },
            iScale: { value: 1 },
            iBaseColor: { value: new THREE.Vector3(baseColor.r, baseColor.g, baseColor.b) },
            iBrightness: { value: brightness },
            iEdgeIntensity: { value: edgeIntensity },
          },
          vertexShader,
          fragmentShader,
          transparent: true,
          depthTest: false,
          depthWrite: false,
        });

        scene.add(new THREE.Mesh(geometry, material));

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(1, 1), bloomStrength, bloomRadius, bloomThreshold);
        composer.addPass(bloomPass);
        const filmPass = new ShaderPass(filmGrainShader);
        composer.addPass(filmPass);
        composer.addPass(unpremultiplyPass);

        function calculateScale() {
          const base = 600;
          const current = Math.min(Math.max(1, window.innerWidth), Math.max(1, window.innerHeight));
          return Math.max(0.5, Math.min(2, current / base));
        }

        function resizeGhostCursor() {
          const width = Math.floor(window.innerWidth);
          const height = Math.floor(window.innerHeight);
          if (width <= 0 || height <= 0) {
            hasValidSize = false;
            return;
          }

          const currentDpr = Math.min(window.devicePixelRatio || 1, maxDevicePixelRatio);
          const need = width * height * currentDpr * currentDpr;
          const scale = need <= targetPixels ? 1 : Math.max(0.5, Math.min(1, Math.sqrt(targetPixels / Math.max(1, need))));
          const pixelRatio = currentDpr * scale;

          renderer.setPixelRatio(pixelRatio);
          renderer.setSize(width, height, false);
          composer.setPixelRatio?.(pixelRatio);
          composer.setSize(width, height);
          const pixelWidth = Math.max(1, Math.floor(width * pixelRatio));
          const pixelHeight = Math.max(1, Math.floor(height * pixelRatio));
          material.uniforms.iResolution.value.set(pixelWidth, pixelHeight, 1);
          material.uniforms.iScale.value = calculateScale();
          bloomPass.setSize(pixelWidth, pixelHeight);
          hasValidSize = true;
        }

        function animateGhostCursor() {
          if (!hasValidSize) {
            raf = requestAnimationFrame(animateGhostCursor);
            return;
          }

          const now = performance.now();
          const elapsed = now / 1000;

          if (pointerActive) {
            velocity.set(
              currentMouse.x - material.uniforms.iMouse.value.x,
              currentMouse.y - material.uniforms.iMouse.value.y
            );
            material.uniforms.iMouse.value.copy(currentMouse);
            fadeOpacity = 1;
          } else {
            velocity.multiplyScalar(inertia);
            if (velocity.lengthSq() > 1e-6) {
              material.uniforms.iMouse.value.add(velocity);
            }
            const idleTime = now - lastMoveTime;
            if (idleTime > fadeDelay) {
              const k = Math.min(1, (idleTime - fadeDelay) / fadeDuration);
              fadeOpacity = Math.max(0, 1 - k);
            }
          }

          head = (head + 1) % trailBuffer.length;
          trailBuffer[head].copy(material.uniforms.iMouse.value);
          const trailUniform = material.uniforms.iPrevMouse.value;
          for (let i = 0; i < trailBuffer.length; i += 1) {
            const sourceIndex = (head - i + trailBuffer.length) % trailBuffer.length;
            trailUniform[i].copy(trailBuffer[sourceIndex]);
          }

          material.uniforms.iOpacity.value = fadeOpacity;
          material.uniforms.iTime.value = elapsed;
          filmPass.uniforms.iTime.value = elapsed;
          composer.render();

          if (!pointerActive && fadeOpacity <= 0.001) {
            running = false;
            raf = null;
            return;
          }

          raf = requestAnimationFrame(animateGhostCursor);
        }

        function ensureGhostLoop() {
          if (!running) {
            running = true;
            raf = requestAnimationFrame(animateGhostCursor);
          }
        }

        window.addEventListener(
          "pointermove",
          (event) => {
            currentMouse.set(
              THREE.MathUtils.clamp(event.clientX / Math.max(1, window.innerWidth), 0, 1),
              THREE.MathUtils.clamp(1 - event.clientY / Math.max(1, window.innerHeight), 0, 1)
            );
            pointerActive = true;
            lastMoveTime = performance.now();
            ensureGhostLoop();
          },
          { passive: true }
        );

        window.addEventListener(
          "pointerleave",
          () => {
            pointerActive = false;
            lastMoveTime = performance.now();
            ensureGhostLoop();
          },
          { passive: true }
        );

        window.addEventListener("resize", resizeGhostCursor, { passive: true });
        resizeGhostCursor();
      }

      initGhostCursor(document.querySelector("#ghostCursor"));

      const directionalAvatar = profile.avatar.mode === "directional" ? profile.avatar : null;
      const ANGLE_KEYS = directionalAvatar?.directionalFrames ?? [];
      const CENTER_KEY = directionalAvatar?.centerFrame ?? null;
      let activeKey = CENTER_KEY?.key ?? "";

      [...ANGLE_KEYS, ...(CENTER_KEY ? [CENTER_KEY] : [])].forEach((item) => {
        const img = new Image();
        img.src = item.src;
      });

      function angleDistance(a, b) {
        const diff = Math.abs(a - b) % 360;
        return diff > 180 ? 360 - diff : diff;
      }

      function chooseAngleKey(pointerX, pointerY) {
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        const dx = pointerX - centerX;
        const dy = pointerY - centerY;
        const distance = Math.hypot(dx, dy);

        if (!CENTER_KEY || ANGLE_KEYS.length === 0) return CENTER_KEY;
        if (distance < Math.min(window.innerWidth, window.innerHeight) * (directionalAvatar.centerDeadZone ?? 0.13)) {
          return CENTER_KEY;
        }

        const angle = (Math.atan2(dy, dx) * 180) / Math.PI;
        const normalized = (angle + 360) % 360;
        return ANGLE_KEYS.reduce((best, candidate) =>
          angleDistance(candidate.angle, normalized) < angleDistance(best.angle, normalized) ? candidate : best
        );
      }

      function setFrame(next) {
        if (!frameImage || !next || next.key === activeKey) return;
        activeKey = next.key;
        frameImage.src = next.src;
      }

      if (directionalAvatar) {
        window.addEventListener(
          "pointermove",
          (event) => {
            setFrame(chooseAngleKey(event.clientX, event.clientY));
          },
          { passive: true }
        );

        window.addEventListener("pointerleave", () => setFrame(CENTER_KEY));
      }

      const glowCards = document.querySelectorAll(".skill-card, .project-card");

      function getEdgeProximity(card, x, y) {
        const width = card.clientWidth;
        const height = card.clientHeight;
        const cx = width / 2;
        const cy = height / 2;
        const dx = x - cx;
        const dy = y - cy;
        const kx = dx === 0 ? Infinity : cx / Math.abs(dx);
        const ky = dy === 0 ? Infinity : cy / Math.abs(dy);
        return Math.min(Math.max(1 / Math.min(kx, ky), 0), 1);
      }

      function getCursorAngle(card, x, y) {
        const cx = card.clientWidth / 2;
        const cy = card.clientHeight / 2;
        const dx = x - cx;
        const dy = y - cy;
        if (dx === 0 && dy === 0) return 0;
        const degrees = Math.atan2(dy, dx) * (180 / Math.PI) + 90;
        return degrees < 0 ? degrees + 360 : degrees;
      }

      glowCards.forEach((card) => {
        card.addEventListener(
          "pointermove",
          (event) => {
            const rect = card.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            const edge = getEdgeProximity(card, x, y);
            const angle = getCursorAngle(card, x, y);

            card.style.setProperty("--edge-proximity", `${(edge * 100).toFixed(3)}`);
            card.style.setProperty("--cursor-angle", `${angle.toFixed(3)}deg`);
          },
          { passive: true }
        );

        card.addEventListener("pointerleave", () => {
          card.style.setProperty("--edge-proximity", "0");
        });
      });
    </script>
  </body>
</html>
